<!DOCTYPE html>
<html lang="en">

<head>
  <!-- ================================================================
       REPEAT-VISIT DETECTION — MUST STAY FIRST IN <head>
       ================================================================
       FIX (Aug 11 2026, Nizam's 3rd report — "2nd open la splash
       animation STILL playing"):

       ROOT CAUSE: this check previously lived in a <script> near the
       BOTTOM of <body>. By the time it ran and added `.minimal`, the
       browser had already parsed the CSS, built the splash element and
       STARTED its animations. On a fast desktop that window is
       invisible; on a budget phone it is long enough to actually watch
       the shuffle play before it gets suppressed. The logic was never
       wrong — it was just too late.

       Running it here, before ANY stylesheet or markup is parsed, sets
       the class on <html> so the very first style resolution already
       knows this is a repeat visit. There is then no frame in which an
       animation can play.

       Deliberately inline and blocking (no defer/async): it must
       complete before CSS is applied, and it is a few microseconds of
       localStorage work.
  -->
  <script>
    (function () {
      try {
        if (localStorage.getItem('allin1_web_splash_seen') === '1') {
          document.documentElement.className += ' a1-repeat-visit';
        }
        localStorage.setItem('allin1_web_splash_seen', '1');
      } catch (e) {
        /* private mode / storage blocked — fall through to full splash */
      }

      // ============================================================
      // FIRST-FRAME LATCH — must be registered HERE, in <head>
      // ============================================================
      // FIX (Aug 11 2026 — Nizam: "splash reappears twice after the home
      // page loads and blocks the app for ~3 seconds"):
      //
      // ROOT CAUSE — a race that our own caching work made WORSE. The
      // `flutter-first-frame` listener lived in a <script> near the
      // BOTTOM of <body>. Once main.dart.js started being served from
      // cache (stale-while-revalidate), Flutter began booting fast
      // enough to FIRE that event before the listener existed. The
      // listener then never ran, `firstFrameFired` stayed false forever,
      // and the two safety timers below fired against a perfectly
      // healthy app:
      //     8s  -> "Taking longer than usual" + Retry button over the UI
      //     20s -> window.location.reload()
      // The reload re-showed the splash, Flutter booted fast again, the
      // race repeated — which is exactly the "reappears twice, blocks
      // interaction" symptom. The safety net designed to rescue a stuck
      // boot was bricking a successful one.
      //
      // Latching the flag on `window` from <head> means the event can
      // never be missed, no matter how fast Flutter paints.
      window.__a1FirstFrame = false;
      window.addEventListener('flutter-first-frame', function () {
        window.__a1FirstFrame = true;
      });
    })();
  </script>

  <!-- ================================================================
       PWA BOOT-TIME VERSION CHECK — MUST STAY IN <head>, AFTER THE
       REPEAT-VISIT LATCH ABOVE
       ================================================================
       FIX (Aug 20 2026 — Nizam: "ovvoru time pwa open pannumbothu
       hosting la irunthu download pannuchuna namma hosting bandwith
       theenthurum"):

       WHAT THIS DOES:
       On every app open (repeat visit only — first visit is a fresh
       download anyway), this block fires BEFORE Flutter boots:

         1. Fetch /version.json with a cache-buster (~200 bytes, no-cache).
            This is the ONLY file that ever touches Firebase Hosting on a
            repeat open. Everything else (index.html, flutter_bootstrap.js,
            main.dart.js, fonts, canvaskit) is now served 100% from the
            Service Worker cache — see pwa_fallback_sw.js's isAppShell guard.

         2. If the fetched version matches what was stored in localStorage
            on the previous open — NO update, NO network traffic, flutter
            boots straight from cache. Total Firebase Hosting bytes: ~200.

         3. If the fetched version is DIFFERENT — a new deploy happened.
            Show "Updating app..." on the splash screen, purge all SW
            caches, then do ONE window.location.reload(). That reload fetches
            the fresh build (the SW cache was just cleared, so it's a real
            network fetch). After that reload the version is stored and
            subsequent opens are back to pure cache.

       WHY ONLY version.json AND NOT index.html:
       The previous design (network-first for index.html) was correct as
       an update-detection mechanism, but it cost a full index.html
       (~67KB) download on every single open. version.json is ~200 bytes
       and contains exactly the same information needed to decide whether
       a reload is warranted. This replaces that network hit with a ~330x
       smaller one, while achieving the exact same result.

       NOTE: This block runs on EVERY open (first-visit OR repeat) but
       the cache-purge + reload branch only fires when the version actually
       changes. First-visit: version stored, no reload. Repeat-visit same
       version: no reload. Repeat-visit new version: update splash + reload.
  ================================================================ -->
  <script>
    (function () {
      var A1_VERSION_KEY = 'allin1_web_build_version';
      var A1_UPDATING_KEY = 'allin1_web_updating';

      // ── Helper: update the splash status text if the element exists ──
      function setSplashStatus(msg) {
        try {
          var el = document.querySelector('.splash-status');
          if (el) el.textContent = msg;
        } catch (e) {}
      }

      // ── If we just did an update-reload, clear the flag and done ──
      // (This open IS the fresh load after a cache purge.)
      try {
        if (sessionStorage.getItem(A1_UPDATING_KEY) === '1') {
          sessionStorage.removeItem(A1_UPDATING_KEY);
          // Store the version we're now running (fetched on the previous
          // open, stored before the reload) so the next open compares correctly.
          // Nothing else to do — SW install() will repopulate the cache as
          // files are fetched by Flutter bootstrap.
          return;
        }
      } catch (e) {}

      // ── Fetch version.json in the background (non-blocking) ──
      // We kick this off immediately in <head> so the HTTP round-trip
      // overlaps with HTML parsing. By the time Flutter finishes booting
      // (hundreds of ms later), the result is almost always ready.
      var isLocalhost =
        location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      if (isLocalhost) return; // dev builds: skip entirely

      try {
        var storedVersion = localStorage.getItem(A1_VERSION_KEY);

        fetch('/version.json?t=' + Date.now(), {
          cache: 'no-store',
          headers: { 'cache-control': 'no-cache' }
        })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (body) {
            if (!body) return;
            var build   = (body['build_number'] || '').toString();
            var version = (body['version']       || '').toString();
            if (!build && !version) return;
            var current = version + '+' + build;

            // Store for future opens (even first visit — baseline).
            try { localStorage.setItem(A1_VERSION_KEY, current); } catch (e) {}

            if (!storedVersion) {
              // First-ever visit or localStorage was cleared. Treat as
              // up-to-date; no reload needed.
              return;
            }

            if (current === storedVersion) {
              // Same version — 100% cache, nothing to do.
              return;
            }

            // ── NEW VERSION DETECTED ─────────────────────────────────
            // Show update message on splash immediately.
            setSplashStatus('⬆️ Updating Allin1...');
            try { document.documentElement.classList.add('a1-updating'); } catch(e) {}

            // Prevent the existing flutter-first-frame listener from
            // hiding the splash before the reload happens.
            window.__a1Updating = true;

            // Purge all SW caches so the reload fetches fresh files.
            var purge = (typeof caches !== 'undefined' && caches.keys)
              ? caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                })
              : Promise.resolve();

            // Also unregister/re-register the SW so it installs fresh.
            var swPurge = ('serviceWorker' in navigator)
              ? navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(regs
                    .filter(function (r) {
                      var u = (r.active || r.waiting || r.installing || {}).scriptURL || '';
                      // Keep firebase-messaging-sw.js — it handles push, not caching.
                      return !u.endsWith('/firebase-messaging-sw.js');
                    })
                    .map(function (r) { return r.unregister(); })
                  );
                })
              : Promise.resolve();

            Promise.all([purge, swPurge]).then(function () {
              // Mark so the NEXT boot (the one after reload) knows it
              // is the fresh load and skips the version-check block.
              try { sessionStorage.setItem(A1_UPDATING_KEY, '1'); } catch (e) {}
              // Brief pause so the user sees the "Updating..." message.
              setTimeout(function () { window.location.reload(); }, 800);
            }).catch(function () {
              // Cache purge failed (shouldn't happen, but be safe).
              try { sessionStorage.setItem(A1_UPDATING_KEY, '1'); } catch (e) {}
              setTimeout(function () { window.location.reload(); }, 800);
            });
          })
          .catch(function () {
            // Offline or version.json unreachable — serve from cache as-is.
            // Do NOT set updating flag or reload; just open normally.
          });
      } catch (e) {
        // localStorage / fetch not available (private mode, etc.) — proceed normally.
      }
    })();
  </script>

      0%       { offset-distance: 0%;   opacity: 0; }
      10%      { opacity: 1; }
      55%      { offset-distance: 100%; opacity: 1; }
      70%      { offset-distance: 100%; opacity: 1; }
      100%     { offset-distance: 100%; opacity: 0; }

    /* Respect the OS "reduce motion" setting — required for
       accessibility, and it also spares low-end devices the compositing

      .a1-stop       { animation: none; opacity: 1; }

       first layout on the main thread. */

    /* ==============================================================
       SPLASH: logo + tricolour smoke glow (Aug 19 2026)
       ==============================================================
       The glow is two radial gradients that start small behind the
       logo and breathe outward to fill the screen.

       PERFORMANCE: only `transform: scale()` and `opacity` are
       animated. Both are handled by the compositor on the GPU, so
       these layers never trigger layout or repaint no matter how large
       they grow. `will-change` promotes them once, up front, instead
       of the browser discovering it mid-animation and stuttering on
       the first cycle - which on a cold boot is the only cycle the
       customer actually sees.

       Colours are the flag's own saffron (#FF9933) and green
       (#138808), kept at low alpha so this reads as a soft haze behind
       a white screen rather than a coloured background.
    */
    .a1-glow-wrap {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .a1-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 120vmax;
      height: 120vmax;
      margin-top: -60vmax;
      margin-left: -60vmax;
      border-radius: 50%;
      will-change: transform, opacity;
    }

    .a1-glow-saffron {
      background: radial-gradient(circle closest-side,
                  rgba(255, 153, 51, 0.30) 0%,
                  rgba(255, 153, 51, 0.13) 42%,
                  rgba(255, 153, 51, 0) 72%);
      animation: a1Smoke 7s ease-in-out infinite;
    }

    .a1-glow-green {
      background: radial-gradient(circle closest-side,
                  rgba(19, 136, 8, 0.24) 0%,
                  rgba(19, 136, 8, 0.10) 42%,
                  rgba(19, 136, 8, 0) 72%);
      /* Offset half a cycle so the two colours cross-fade past each
         other instead of pulsing together as one muddy orange-green. */
      animation: a1Smoke 7s ease-in-out infinite -3.5s;
    }

    @keyframes a1Smoke {
      0%   { transform: scale(0.18); opacity: 0.25; }
      50%  { transform: scale(1.00); opacity: 0.85; }
      100% { transform: scale(0.18); opacity: 0.25; }
    }

    .a1-splash-core {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .a1-splash-logo {

      animation: a1LogoIn 900ms ease-out both;
    }

    @keyframes a1LogoIn {
      from { opacity: 0; transform: scale(0.94); }
      to   { opacity: 1; transform: scale(1); }
    }

    .a1-splash-foot {
      position: absolute;
      bottom: 38px;
      left: 0;
      right: 0;
      z-index: 1;
      text-align: center;
    }

    /* Respect the OS "reduce motion" setting: the glow settles at a
       readable mid-state instead of breathing. */
    @media (prefers-reduced-motion: reduce) {
      .a1-glow { animation: none; transform: scale(0.85); opacity: 0.5; }
      .a1-splash-logo { animation: none; }
    }

    @media (max-width: 380px) {

    @keyframes logoPulse {

    @keyframes shimmer {

       REPLACED WITH: the Myallin1 SuperApp logo, sitting in a saffron

       the spinner and loading text directly BELOW the logo, and only
       "Made with in Erode" kept at the bottom.

       WHY THIS IS CHEAP ENOUGH TO RUN ON THE FIRST FRAME
       This is the very first thing painted, while the Flutter engine
       and Firebase are still loading, on budget Android phones. So the
       glow is built from exactly two radial-gradient layers animated
       ONLY on transform/opacity - both GPU-composited properties that
       never trigger layout or paint. Animating width/height or the
       gradient stops themselves would repaint a full-screen element
       every frame and actively slow down the boot it is covering.

       The old riders used `offset-distance` (CSS Motion Path), which
       forces a geometry recalculation per frame and is the single most
       expensive thing that was on this screen.
  ================================================================ -->
  <div class="splash-screen visible" id="splash-screen" role="progressbar" aria-label="Allin1 Super App loading">

    <div class="a1-glow-wrap" aria-hidden="true">

           fetchpriority="high", i.e. one that competes with the
           Flutter engine download for the very first bytes of a cold
           load. On a weak Erode connection that difference is the
           logo appearing about a second sooner.
           <picture> degrades safely: any browser that doesn't take
           the WebP simply uses the <img> below it. -->

  <script>
    // ================================================================
    // Custom install prompt (Aug 11 2026 — Nizam's Tricolor banner)
    // ================================================================
    // Chrome fires `beforeinstallprompt` ONLY when the app genuinely
    // meets installability criteria (manifest + SW + not already
    // installed). We preventDefault() to suppress the browser's own
    // generic chip, stash the event, and show our banner instead. The
    // native prompt can only be triggered from a real user gesture, so
    // our Install button calls .prompt() directly inside the click
    // handler — deferring it (setTimeout, await, etc.) would make the
    // browser silently discard it.
    (function () {
      var deferredPrompt = null;
      var banner = document.getElementById('a1-install');
      var btn = document.getElementById('a1-install-btn');
      var closeBtn = document.getElementById('a1-install-close');
      var DISMISS_KEY = 'allin1_install_dismissed_at';
      // Re-ask after 7 days rather than never — a customer who dismissed
      // once while busy shouldn't lose the option permanently, but
      // nagging on every visit is how banners get hated.
      var RE_ASK_MS = 7 * 24 * 60 * 60 * 1000;

      // PORTED from the old (now removed) install prompt — increments
      // `poster_qr_pwa_installs` on app_usage_stats/funnel when the
      // install came from a ?source=poster_campaign link. This feeds the
      // Admin "Customer Usage Tracking" funnel; deleting the old block
      // without carrying this across would have silently zeroed that
      // metric. Uses the Firestore REST commit endpoint directly because
      // this runs before Flutter (and therefore the Firestore SDK) has
      // booted. keepalive:true so it still completes if the page is
      // navigating away as the install proceeds.
      function trackInstall() {
        try {
          var params = new URLSearchParams(window.location.search);
          if (params.get('source') === 'poster_campaign') {
            var body = {
              writes: [{
                update: { name: 'projects/erode-super-app/databases/(default)/documents/app_usage_stats/funnel', fields: {} },
                updateMask: { fieldPaths: [] },
                updateTransforms: [
                  { fieldPath: 'poster_qr_pwa_installs', increment: { integerValue: '1' } },
                  { fieldPath: 'updatedAt', setToServerValue: 'REQUEST_TIME' }
                ]
              }]
            };
            fetch('https://firestore.googleapis.com/v1/projects/erode-super-app/databases/(default)/documents:commit', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
              keepalive: true
            }).catch(function(){});
          }
        } catch (e) {}
      }

      function recentlyDismissed() {
        try {
          var t = parseInt(localStorage.getItem(DISMISS_KEY) || '0', 10);
          return t > 0 && (Date.now() - t) < RE_ASK_MS;
        } catch (e) { return false; }
      }

      // ================================================================
      // ROOT CAUSE FIX (Aug 17 2026) — "hero pwa open anathum hero pwa
      // install pandra button kaatala, seller kum kaatala, admin kum
      // kaatala, only customer pwa kulla pona mattum install kaatuthu".
      // ================================================================
      // This was an EVENT-ORDER RACE, not a manifest or flavor problem
      // (all four manifests are structurally identical and valid, and
      // all four register the same service worker).
      //
      // The old code registered its 'flutter-first-frame' listener
      // INSIDE the 'beforeinstallprompt' handler. flutter-first-frame
      // fires exactly ONCE. So the banner could only ever appear if
      // Chrome delivered beforeinstallprompt BEFORE Flutter painted:
      //
      //   beforeinstallprompt -> then first-frame   = banner shows
      //   first-frame -> then beforeinstallprompt   = listener attached
      //                                               to an event that
      //                                               already fired,
      //                                               banner NEVER shows
      //
      // Which order you get depends on how long the app takes to paint.
      // CUSTOMER is by far the heaviest bundle and the slowest first
      // frame, so beforeinstallprompt almost always won that race and
      // the banner worked. HERO, SELLER and ADMIN are smaller and paint
      // sooner, so they usually lost it — and silently showed nothing.
      // The symptom looked flavor-specific; the cause was just speed.
      //
      // Fixed by removing the nesting: both events now set a flag and
      // call one shared function, so the banner appears whichever order
      // they arrive in.
      var firstFrameSeen = false;
      var bannerShown = false;

      function maybeShowInstallBanner() {
        if (bannerShown) return;
        if (!banner || !deferredPrompt) return;
        if (!firstFrameSeen) return;
        if (recentlyDismissed()) return;
        bannerShown = true;
        // Still held back a beat after first paint — showing it over the
        // splash would cover the boot the user is waiting on, and on a
        // budget phone it competes for layout work during the most
        // expensive moment of startup.
        setTimeout(function () {
          if (banner && deferredPrompt) banner.classList.add('show');
        }, 1200);
      }

      window.addEventListener('flutter-first-frame', function () {
        firstFrameSeen = true;
        maybeShowInstallBanner();
      });

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
        maybeShowInstallBanner();
      });

      if (btn) {
        btn.addEventListener('click', function () {
          if (!deferredPrompt) return;
          if (banner) banner.classList.remove('show');
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(function (choiceResult) {
            if (choiceResult && choiceResult.outcome === 'accepted') {
              trackInstall();
            }
            // Cleared either way: the event is single-use, and Chrome
            // will fire a fresh one later if the app is still
            // installable.
            deferredPrompt = null;
          });
        });
      }

      if (closeBtn) {
        closeBtn.addEventListener('click', function () {
          if (banner) banner.classList.remove('show');
          try { localStorage.setItem(DISMISS_KEY, String(Date.now())); } catch (e) {}
        });
      }

      // Installed (via our banner or the browser menu) — never show it
      // again this session.
      window.addEventListener('appinstalled', function () {
        deferredPrompt = null;
        if (banner) banner.classList.remove('show');
        try { localStorage.setItem(DISMISS_KEY, String(Date.now())); } catch (e) {}
      });
    })();
  </script>

  <!-- Splash Screen Script -->
  <script>
    (function () {
      var splash = document.getElementById('splash-screen');
      var status = document.querySelector('.splash-status');
      var retryBtn = document.getElementById('splash-retry-btn');
      // Seeded from the <head> latch — if Flutter already painted before
      // this script ran, we must know about it immediately rather than
      // waiting for an event that has already been and gone.
      var firstFrameFired = window.__a1FirstFrame === true;

      // Belt-and-braces: even if BOTH the latch and the event somehow
      // failed, a rendered Flutter app puts its own host element in the
      // DOM. Checking for it means we can never reload a working app.
      function flutterHasPainted() {
        return window.__a1FirstFrame === true ||
          firstFrameFired ||
          !!document.querySelector('flutter-view, flt-glass-pane, flt-scene-host');
      }

      // FIX (Aug 11 2026 — Nizam's "2nd open pannumbothu 2 type
      // animations varuthu, app slow feel aaguthu"): this HTML splash is
      // SEPARATE from the Flutter-side splash video (which we already
      // made first-launch-only in main_customer.dart). It used to render
      // the full branded screen — logo, title, subtitle, spinner AND a
      // status line cycling through 4 different messages every 800ms — on
      // EVERY single PWA open. Two of those messages ("Loading
      // resources...", "Almost ready...") are exactly the two "different
      // animations" reported, and the cycling text is what makes a fast
      // boot still FEEL slow: motion on screen reads as "still working".
      //
      // Repeat opens now get a bare, static splash: same background so
      // there's no white flash, but no logo, no text, no spinner, no
      // interval timer. Flutter still needs a moment to boot (we can't
      // remove that), but nothing animates, so it reads as instant rather
      // than as a loading screen. The full branded splash is preserved
      // for the first-ever visit, where it's genuinely doing useful work
      // covering a cold download.
      var isRepeatVisit = false;
      try {
        isRepeatVisit = localStorage.getItem('allin1_web_splash_seen') === '1';
        localStorage.setItem('allin1_web_splash_seen', '1');
      } catch (e) {
        // localStorage blocked (private mode / strict settings) — fall
        // back to the full splash rather than breaking boot.
        isRepeatVisit = false;
      }

      var statusInterval = null;
      if (splash) splash.classList.add('coldboot');

      // The animated, branded experience runs on every visit now.
      var statuses = ['Initializing...', 'Loading resources...', 'Preparing app...', 'Almost ready...'];
      var index = 0;
      statusInterval = setInterval(function () {
        index = (index + 1) % statuses.length;
        if (status) status.textContent = statuses[index];
      }, 800);

      // Hide splash when Flutter is ready
      window.addEventListener('flutter-first-frame', function () {
        firstFrameFired = true;
        window.__a1FirstFrame = true;
        clearInterval(statusInterval);

        // FIX (Aug 20 2026 — version-update flow): if an update was
        // detected in <head>'s version-check block, window.__a1Updating
        // is true and a page reload is already queued. Keep the splash
        // visible (it's showing "Updating Allin1...") so the user sees
        // the update message rather than a flash of the old app UI.
        if (window.__a1Updating) {
          return; // reload will happen in ~800ms; leave splash in place
        }

        // HARDENED (Aug 11 2026): on a REPEAT visit tear the splash down
        // synchronously — no fade, no 400ms transition, no extra frame.
        // The splash exists on repeat boots only to cover main.dart.js
        // parse; the instant that's done it must be gone, not gracefully
        // dissolving. Returning early also skips the 400ms setTimeout
        // below entirely.
        if (isRepeatVisit) {
          if (splash) {
            splash.classList.add('instant-hide');
            splash.style.display = 'none';
          }
          return;
        }

        // Cold boot only: let the shuffle settle rather than being cut
        // mid-animation.
        if (splash) splash.classList.add('resolving');
        if (splash) {
          splash.classList.add('hidden');
          splash.classList.remove('visible');
          setTimeout(function () {
            splash.style.display = 'none';
          }, 400);
        }
      }, { once: true });

      // FIX (black/white-screen-stuck audit, per Nizam's request): this
      // used to unconditionally HIDE the splash after 8 seconds no
      // matter what — including when Flutter genuinely failed to boot
      // (slow/dropped network mid-download on a weak Erode connection,
      // a JS exception, low-memory phone killing the tab's script).
      // Since <body> has no background color of its own, hiding the
      // splash in that failure case left a literally blank white page
      // with NO error, NO retry — just silence forever, matching
      // exactly what Nizam reported ("black/white screen la
      // ninnuruthu"). Now: if flutter-first-frame never fired by 8s,
      // keep the splash visible and swap the loader for a Retry button
      // instead of hiding into a dead page.
      setTimeout(function () {
        // Guarded by flutterHasPainted(), not the local flag alone — the
        // flag could be stale if the event fired before this script ran.
        if (flutterHasPainted()) return;
        clearInterval(statusInterval);
        if (status) status.textContent = 'Taking longer than usual to load.';
        
        // Automatic background retry instead of manual button.
        // We only do this if it's a repeat visit, because on a repeat visit
        // Hive Cache / pwa_fallback_sw are ready, so a reload can successfully
        // open the app offline. If it's a first visit, reloading just spins again.
        // FIX: Also disable this on localhost, since DDC compilation can easily 
        // exceed 20 seconds and we don't want to abort the compiler.
        var isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        if (isRepeatVisit && !isLocalhost) {
          setTimeout(function() {
            if (!flutterHasPainted()) {
              // Prevent infinite reload loop on slow networks
              var hasAutoRetried = sessionStorage.getItem('autoRetried') === 'true';
              if (!hasAutoRetried) {
                sessionStorage.setItem('autoRetried', 'true');
                if (status) status.textContent = 'Retrying connection...';
                window.location.reload();
              } else {
                if (status) status.textContent = 'Network is very slow. Please wait...';
              }
            }
          }, 12000); // Wait 12 more seconds (total 20s) before auto-reloading ONE TIME
        }
      }, 8000);

      // ── PWA BACK-BUTTON GUARD ──────────────────────────────────
      // FIX (Aug 11 2026 — Nizam: "mobile la iruka back option press
      // panni back pona app close agi reopen aguthu apayum splash
      // varrathunala delay aaguthu"):
      //
      // ROOT CAUSE: in an installed PWA, Android's hardware Back maps to
      // browser Back. Flutter pushes a browser-history entry for NAMED
      // routes, but most of this app navigates with Navigator.push() +
      // MaterialPageRoute, which does NOT add one. So browser history
      // often holds just the single initial entry — meaning the very
      // first hardware-Back press navigates AWAY from the app entirely,
      // closing the PWA. Reopening then pays the full cold-boot cost
      // (splash + Flutter bootstrap), which is the delay reported. The
      // in-app back arrow was unaffected because it drives Flutter's own
      // Navigator directly, never touching browser history — exactly
      // matching "screen back button works, phone back button doesn't".
      //
      // FIX: seed one extra history entry at boot, and on every popstate
      // immediately push it back. Hardware Back then always lands on our
      // sentinel instead of exiting, and Flutter's own PopScope handlers
      // (see dashboard_screen.dart's exit-confirmation dialog) stay in
      // control of what Back actually means. Deliberately NOT applied to
      // plain browser tabs — only to the installed/standalone PWA, since
      // trapping Back in a normal tab would break the user's expectation
      // of navigating back to whatever page they came from.
      try {
        var isStandalone =
          window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true;
        if (isStandalone) {
          history.pushState({ allin1Guard: true }, '');
          window.addEventListener('popstate', function () {
            // Re-arm the sentinel so the next Back press is also caught.
            history.pushState({ allin1Guard: true }, '');
          });
        }
      } catch (e) {
        // History API unavailable — degrade to previous behaviour rather
        // than breaking boot.
      }

      setTimeout(function () {
        if (!flutterHasPainted()) {
          console.warn('[PWA] App is taking exceptionally long to boot. Waiting for user to click Retry if needed.');
        }
      }, 20000);
    })();
  </script>

  <!-- ── PWA Auto-Update: Force fresh code on new deploy ──────────── -->
  <script>
    // ── WebGL context loss recovery & Secure Task Switcher ──
    // FIX (Aug 20 2026 — Nizam: "pwa lock panni reopen pannuna loading
    // nu athe page laye nikkuthu no response"):
    //
    // ROOT CAUSE: when the device was unlocked (visible), the old code
    // waited 450ms then added .hidden (opacity:0 + visibility:hidden)
    // and only set display:none after ANOTHER 400ms transition. On slow
    // phones this 850ms total window races against the CanvasKit resize
    // events and can leave the splash permanently blocking the UI if
    // the display:none setTimeout is dropped by the browser's timer
    // throttling (which Chrome throttles on page-visibility-change for
    // pages that are being "hidden" even briefly).
    //
    // FIX: use instant-hide (display:none !important) instead of the
    // slow fade chain on resume. The splash was only up for a fraction
    // of a second anyway (just to cover the WebGL black-flash), so
    // a graceful fade-out here adds nothing but risk. The resize events
    // still run first to restore CanvasKit, THEN the splash is nuked.
    document.addEventListener('visibilitychange', () => {
      const splash = document.querySelector('.splash-screen');
      if (document.visibilityState === 'hidden') {
        // Show splash screen instantly when backgrounded.
        // 1. Acts as a privacy screen in the OS task switcher.
        // 2. Hides the CanvasKit WebGL context loss freeze/black screen.
        if (splash) {
          splash.classList.remove('hidden', 'resolving', 'instant-hide');
          splash.classList.add('visible');
          splash.style.display = 'flex';
          splash.style.opacity = '1';
        }
      } else if (document.visibilityState === 'visible') {
        // Fire resize events to force CanvasKit to repaint its WebGL context.
        window.dispatchEvent(new Event('resize'));
        setTimeout(() => window.dispatchEvent(new Event('resize')), 80);
        setTimeout(() => window.dispatchEvent(new Event('resize')), 200);

        // Only hide the splash if Flutter has already done its initial cold boot.
        // If we're still in the initial load, the flutter-first-frame listener
        // will take care of hiding it — we must not interfere.
        if (window.__a1FirstFrame === true) {
          // Short pause (200ms) to let the CanvasKit repaint finish before
          // revealing the canvas. Then instant-hide — no slow fade — so
          // the splash cannot get stuck in a half-hidden state under timer
          // throttling.
          setTimeout(() => {
            if (splash && window.__a1FirstFrame === true) {
              splash.classList.add('instant-hide');
              splash.style.display = 'none';
              splash.style.opacity = '';
            }
          }, 200);
        }
      }
    });

    // ── Update detection lives in Dart now ──────────────────────────
    //
    // This block used to watch service-worker update events and set
    // window.allin1UpdateAvailable for the in-app UPDATE button to
    // read. That approach is dead:
    //
    //   * Flutter's current service worker UNREGISTERS ITSELF on
    //     activate (verified on the deployed file) and has no fetch
    //     handler, so it can never report an update.
    //   * `--pwa-strategy` is deprecated and being removed, so
    //     service-worker caching is not something to build on.
    //
    // The console showed the consequence directly:
    //   "[PWA] update check failed: InvalidStateError: Failed to
    //    update a ServiceWorker ... The object is in an invalid state."
    //
    // web_version_checker.dart now compares /version.json against the
    // build this tab loaded with. No service worker involved, nothing
    // deprecated, identical behaviour on every Flutter version.
    //
    // flutter_service_worker.js is still NOT registered here — it has
    // no fetch handler and self-unregisters on activate, and that
    // self-unregister ALSO force-navigates/reloads every client it
    // controls, which caused a mobile blank-screen-after-update bug
    // right after a fresh deploy. Still never registered.
    //
    // FIX (Aug 8 2026 — "namma pwa vayum mobile app mari... net ilana
    // open agamattingithu"): pwa_fallback_sw.js used to be genuinely
    // inert (fetch listener registered but never respondWith()'d, zero
    // caching) purely to satisfy Chrome's installability check while
    // side-stepping the stale-cache bug above. It now does real,
    // network-first offline caching of the app shell — see that file's
    // own top-of-file comment for exactly how it avoids reintroducing
    // either the stale-forever bug or the force-reload-mid-boot bug.
    // Net effect: online behaviour is unchanged (always the freshest
    // deploy), but the app shell now also opens with zero network,
    // like an installed native app.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        // ================================================================
        // ROOT CAUSE FIX (Aug 17 2026) — "seller app localhost la run
        // aiduchu but romba nerama front screen laye suthittu iruku"
        // ================================================================
        // Symptom: localhost:5000 sits on the splash forever. DevTools
        // shows ~2000 requests, every one "Pending", and — the tell —
        // "0 B transferred / 0 B resources". Console shows
        // "DDC is about to load 2009/2009 scripts with pool size = 1000".
        //
        // Why: `flutter run` serves a DEBUG build compiled by DDC, which
        // is not one main.dart.js but ~2000 individual .dart.lib.js
        // modules. This service worker's default branch below calls
        // event.respondWith(...) for EVERY same-origin GET, and on each
        // one it clones the response and does a cache.put(). That design
        // is correct and cheap in production (one big bundle, a handful
        // of files) but on a DDC build it means ~2000 requests are all
        // funnelled through the single service-worker thread, each
        // paying a Cache Storage write, on top of the browser's 6
        // concurrent connections per HTTP/1.1 origin. The worker becomes
        // the bottleneck and the boot effectively never finishes. The
        // "0 B transferred" is the fingerprint of requests being served
        // through a service worker rather than straight from the network.
        //
        // Fix: do not run the PWA worker on localhost at all. Same guard
        // and same reasoning as the boot-watchdog's isLocalhost check
        // further up this file, which already exists precisely because
        // "DDC compilation can easily exceed 20 seconds".
        //
        // NOTHING IS REMOVED: this is a dev-machine-only guard. On
        // my-allin1.web.app (and any real host) every line below runs
        // exactly as before — offline app shell, cache-first heavy
        // bundles, stale-worker self-heal, FCM worker. Only a developer
        // hitting localhost skips it, and a developer does not need
        // offline caching of a build they are actively recompiling.
        //
        // It also actively UNREGISTERS any worker already installed on
        // localhost from previous runs — without this, the worker that
        // is already controlling this origin keeps intercepting today's
        // requests no matter what we skip registering now. That is why
        // the app kept hanging across restarts.
        const isLocalhost =
          location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (isLocalhost) {
          navigator.serviceWorker.getRegistrations().then((regs) => {
            for (const reg of regs) {
              console.warn('[PWA] localhost dev build — unregistering service worker:', reg.active?.scriptURL || '(installing)');
              reg.unregister();
            }
            // Drop the caches too: a cache populated by an earlier
            // production visit to this same origin can otherwise serve a
            // stale main.dart.js over today's DDC modules.
            if (window.caches && caches.keys) {
              caches.keys().then((keys) => keys.forEach((k) => caches.delete(k)));
            }
          }).catch(() => {});
          return;
        }

        // ROOT CAUSE FIX (Aug 8 2026) — "selfie camera MissingPluginException
        // persists even after a completely fresh rebuild + redeploy".
        //
        // The comments above explain why flutter_service_worker.js is no
        // longer *registered* going forward. What they missed: any
        // browser/device that visited this site BEFORE that change was
        // made already has that old worker installed, active, and
        // controlling every navigation on this origin. A service worker's
        // fetch handler intercepts requests BEFORE they ever reach the
        // network or respect Cache-Control headers — so Firebase Hosting's
        // "no-cache" header on main.dart.js (see firebase.json) is
        // completely bypassed. The old worker just keeps serving its own
        // precached main.dart.js from whatever build was live when it was
        // installed, forever, on that one device — regardless of how many
        // times the app gets rebuilt and redeployed, and regardless of a
        // manual hard-reload (a controlling service worker survives those
        // too; only DevTools "Unregister" or Clear Site Data removes it).
        // That precached bundle can predate camera/image_picker even being
        // added to pubspec.yaml, which is exactly the MissingPluginException
        // signature reported here.
        //
        // Fix: self-heal on load. Enumerate every registration for this
        // origin and unregister anything that ISN'T pwa_fallback_sw.js —
        // this only ever needs to fire once per affected device, after
        // which only the intentionally-inert fallback worker remains.
        //
        // FIX (Aug 10 2026 — root cause of "Hero PWA never receives
        // background ride/service pings"): this loop used to treat
        // firebase-messaging-sw.js (which did not exist as a file until
        // this same fix) the same as any other "stale" worker and
        // unregistered it on every page load, before it ever had a
        // chance to receive a push. Carved out an explicit exception —
        // this is the ONLY other worker this origin intentionally runs.
        navigator.serviceWorker.getRegistrations().then((regs) => {
          for (const reg of regs) {
            const url = reg.active?.scriptURL || reg.waiting?.scriptURL || reg.installing?.scriptURL || '';
            if (!url.endsWith('/pwa_fallback_sw.js') && !url.endsWith('/firebase-messaging-sw.js')) {
              console.warn('[PWA] Unregistering stale service worker:', url);
              reg.unregister();
            }
          }
        }).catch((err) => {
          console.warn('[PWA] Could not enumerate service worker registrations:', err);
        });

        navigator.serviceWorker.register('/pwa_fallback_sw.js')
          .catch(err => console.warn('[PWA] fallback service worker registration failed:', err));

        // FIX (same root cause as above): firebase-messaging-sw.js must
        // be explicitly registered too — Firebase Messaging's web SDK
        // does NOT auto-register it, unlike some other Firebase web
        // features. Registered at the default scope ('/'), same as
        // pwa_fallback_sw.js; both can coexist since Firebase Messaging
        // only intercepts push events, never fetch, so there is no
        // routing conflict between the two workers.
        navigator.serviceWorker.register('/firebase-messaging-sw.js')
          .catch(err => console.warn('[PWA] firebase-messaging-sw.js registration failed:', err));
      });
    }
  </script>
