<head>
  <!-- ================================================================
       REPEAT-VISIT DETECTION — MUST STAY FIRST IN <head>
       ================================================================
       FIX (Aug 11 2026, Nizam's 3rd report — "2nd open la splash
       animation STILL playing"):

       ROOT CAUSE: this check previously lived in a <script> near the
       BOTTOM of <body>. By the time it ran and added `.minimal`, the
       browser had already parsed the CSS, built the splash element and
       STARTED its animations. On a fast desktop that window is
       invisible; on a budget phone it is long enough to actually watch
       the shuffle play before it gets suppressed. The logic was never
       wrong — it was just too late.

       Running it here, before ANY stylesheet or markup is parsed, sets
       the class on <html> so the very first style resolution already
       knows this is a repeat visit. There is then no frame in which an
       animation can play.

       Deliberately inline and blocking (no defer/async): it must
       complete before CSS is applied, and it is a few microseconds of
       localStorage work.
  -->
  <script>
    (function () {
      try {
        if (localStorage.getItem('allin1_web_splash_seen') === '1') {
          document.documentElement.className += ' a1-repeat-visit';
        }
        localStorage.setItem('allin1_web_splash_seen', '1');
      } catch (e) {
        /* private mode / storage blocked — fall through to full splash */
      }

      // ============================================================
      // FIRST-FRAME LATCH — must be registered HERE, in <head>
      // ============================================================
      // FIX (Aug 11 2026 — Nizam: "splash reappears twice after the home
      // page loads and blocks the app for ~3 seconds"):
      //
      // ROOT CAUSE — a race that our own caching work made WORSE. The
      // `flutter-first-frame` listener lived in a <script> near the
      // BOTTOM of <body>. Once main.dart.js started being served from
      // cache (stale-while-revalidate), Flutter began booting fast
      // enough to FIRE that event before the listener existed. The
      // listener then never ran, `firstFrameFired` stayed false forever,
      // and the two safety timers below fired against a perfectly
      // healthy app:
      //     8s  -> "Taking longer than usual" + Retry button over the UI
      //     20s -> window.location.reload()
      // The reload re-showed the splash, Flutter booted fast again, the
      // race repeated — which is exactly the "reappears twice, blocks
      // interaction" symptom. The safety net designed to rescue a stuck
      // boot was bricking a successful one.
      //
      // Latching the flag on `window` from <head> means the event can
      // never be missed, no matter how fast Flutter paints.
      window.__a1FirstFrame = false;
      window.addEventListener('flutter-first-frame', function () {
        window.__a1FirstFrame = true;
      });
    })();
  </script>

    /* ============================================================
       ROUTE-DRAW SPLASH (Aug 12 2026 — CEO/CTO: replace the MP4 video
       splashes with "a highly classy, ultra-lightweight pure HTML/CSS/
       SVG animation... a map/route line draws itself dynamically, and

       Container class name (.splash-icons) is DELIBERATELY reused so
       every existing suppression rule keeps working untouched —
       .a1-repeat-visit .splash-icons, .splash-screen.minimal
       .splash-icons and .splash-screen.resolving .splash-icons all
       still apply with no edits. Repeat visitors therefore still get
       the instant, animation-free splash.
       ============================================================ */
    .splash-icons {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 380px;
      margin-top: 18px;
      width: 100%;
    }
    .a1-route {
      width: 320px;
      height: 380px;
      overflow: visible;
    }

    /* The road underlay — a soft, static guide the live route draws on
       top of, so the line never appears to travel through empty space. */
    .a1-route-bed {
      fill: none;
      stroke: rgba(255, 79, 163, 0.16);
      stroke-width: 3;
      stroke-linecap: round;
    }

    /* The drawing line itself. 800 is a safe overestimate of the new TN path. */
    .a1-route-line {
      fill: none;
      stroke: url(#a1RouteGrad);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 800;
      stroke-dashoffset: 800;
      animation: a1RouteDraw 4s ease-in-out infinite;
    }
    @keyframes a1RouteDraw {
      0%   { stroke-dashoffset: 800; }
      55%  { stroke-dashoffset: 0; }
      85%  { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }

    /* Waypoint pins pop in as the line reaches them. Each --d is tuned
       to land just after the stroke passes that x-position. */
    .a1-stop {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: a1StopPop 3.2s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      animation-delay: var(--d, 0s);
    }
    @keyframes a1StopPop {
      0%, 8%  { opacity: 0; transform: translateY(6px) scale(0.4); }
      18%     { opacity: 1; transform: translateY(-2px) scale(1.12); }
      26%     { opacity: 1; transform: translateY(0) scale(1); }
      80%     { opacity: 1; transform: translateY(0) scale(1); }
      100%    { opacity: 0; transform: translateY(-4px) scale(0.9); }
    }

    /* Origin + destination markers: always-on anchors so the animation
       reads as "a journey", not a line with a gap at each end. */
    .a1-pulse {
      transform-box: fill-box;
      transform-origin: center;
      animation: a1Pulse 3.2s ease-in-out infinite;
    }
    @keyframes a1Pulse {
      0%, 100% { opacity: 0.55; transform: scale(0.85); }
      50%      { opacity: 1;    transform: scale(1.15); }
    }

    /* The rider travelling the route. offset-path is the clean way to
       follow the exact same curve; browsers without it (very old) simply
       show the vehicle parked at the origin, which still looks
       intentional rather than broken. */
    .a1-rider {
      offset-path: path("M 340,40 C 250,90 130,130 160,160 C 190,190 250,190 230,220 C 210,250 170,290 180,320 C 190,350 170,390 160,460");
      offset-rotate: auto;
      animation: a1Ride 4s ease-in-out infinite;
    }
    @keyframes a1Ride {
      0%       { offset-distance: 0%;   opacity: 0; }
      10%      { opacity: 1; }
      55%      { offset-distance: 100%; opacity: 1; }
      70%      { offset-distance: 100%; opacity: 1; }
      100%     { offset-distance: 100%; opacity: 0; }
    }

    /* Respect the OS "reduce motion" setting — required for
       accessibility, and it also spares low-end devices the compositing
       work on the very first frame of the app. */
    @media (prefers-reduced-motion: reduce) {
      .a1-route-line { animation: none; stroke-dashoffset: 0; }
      .a1-stop       { animation: none; opacity: 1; }
      .a1-rider      { animation: none; offset-distance: 100%; }
      .a1-pulse      { animation: none; opacity: 1; }
    }

  <script>
    // ================================================================
    // Custom install prompt (Aug 11 2026 — Nizam's Tricolor banner)
    // ================================================================
    // Chrome fires `beforeinstallprompt` ONLY when the app genuinely
    // meets installability criteria (manifest + SW + not already
    // installed). We preventDefault() to suppress the browser's own
    // generic chip, stash the event, and show our banner instead. The
    // native prompt can only be triggered from a real user gesture, so
    // our Install button calls .prompt() directly inside the click
    // handler — deferring it (setTimeout, await, etc.) would make the
    // browser silently discard it.
    (function () {
      var deferredPrompt = null;
      var banner = document.getElementById('a1-install');
      var btn = document.getElementById('a1-install-btn');
      var closeBtn = document.getElementById('a1-install-close');
      var DISMISS_KEY = 'allin1_install_dismissed_at';
      // Re-ask after 7 days rather than never — a customer who dismissed
      // once while busy shouldn't lose the option permanently, but
      // nagging on every visit is how banners get hated.
      var RE_ASK_MS = 7 * 24 * 60 * 60 * 1000;

      // PORTED from the old (now removed) install prompt — increments
      // `poster_qr_pwa_installs` on app_usage_stats/funnel when the
      // install came from a ?source=poster_campaign link. This feeds the
      // Admin "Customer Usage Tracking" funnel; deleting the old block
      // without carrying this across would have silently zeroed that
      // metric. Uses the Firestore REST commit endpoint directly because
      // this runs before Flutter (and therefore the Firestore SDK) has
      // booted. keepalive:true so it still completes if the page is
      // navigating away as the install proceeds.
      function trackInstall() {
        try {
          var params = new URLSearchParams(window.location.search);
          if (params.get('source') === 'poster_campaign') {
            var body = {
              writes: [{
                update: { name: 'projects/erode-super-app/databases/(default)/documents/app_usage_stats/funnel', fields: {} },
                updateMask: { fieldPaths: [] },
                updateTransforms: [
                  { fieldPath: 'poster_qr_pwa_installs', increment: { integerValue: '1' } },
                  { fieldPath: 'updatedAt', setToServerValue: 'REQUEST_TIME' }
                ]
              }]
            };
            fetch('https://firestore.googleapis.com/v1/projects/erode-super-app/databases/(default)/documents:commit', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
              keepalive: true
            }).catch(function(){});
          }
        } catch (e) {}
      }

      function recentlyDismissed() {
        try {
          var t = parseInt(localStorage.getItem(DISMISS_KEY) || '0', 10);
          return t > 0 && (Date.now() - t) < RE_ASK_MS;
        } catch (e) { return false; }
      }

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
        if (recentlyDismissed()) return;
        // Hold the banner back until Flutter has painted — showing it
        // over the splash would cover the boot the customer is waiting
        // on, and on a budget phone it also competes for layout work
        // during the most expensive moment of startup.
        window.addEventListener('flutter-first-frame', function () {
          setTimeout(function () {
            if (banner && deferredPrompt) banner.classList.add('show');
          }, 1200);
        });
      });

      if (btn) {
        btn.addEventListener('click', function () {
          if (!deferredPrompt) return;
          if (banner) banner.classList.remove('show');
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(function (choiceResult) {
            if (choiceResult && choiceResult.outcome === 'accepted') {
              trackInstall();
            }
            // Cleared either way: the event is single-use, and Chrome
            // will fire a fresh one later if the app is still
            // installable.
            deferredPrompt = null;
          });
        });
      }

      if (closeBtn) {
        closeBtn.addEventListener('click', function () {
          if (banner) banner.classList.remove('show');
          try { localStorage.setItem(DISMISS_KEY, String(Date.now())); } catch (e) {}
        });
      }

      // Installed (via our banner or the browser menu) — never show it
      // again this session.
      window.addEventListener('appinstalled', function () {
        deferredPrompt = null;
        if (banner) banner.classList.remove('show');
        try { localStorage.setItem(DISMISS_KEY, String(Date.now())); } catch (e) {}
      });
    })();
  </script>

  <!-- Splash Screen Script -->
  <script>
    (function () {
      var splash = document.getElementById('splash-screen');
      var status = document.querySelector('.splash-status');
      var retryBtn = document.getElementById('splash-retry-btn');
      // Seeded from the <head> latch — if Flutter already painted before
      // this script ran, we must know about it immediately rather than
      // waiting for an event that has already been and gone.
      var firstFrameFired = window.__a1FirstFrame === true;

      // Belt-and-braces: even if BOTH the latch and the event somehow
      // failed, a rendered Flutter app puts its own host element in the
      // DOM. Checking for it means we can never reload a working app.
      function flutterHasPainted() {
        return window.__a1FirstFrame === true ||
          firstFrameFired ||
          !!document.querySelector('flutter-view, flt-glass-pane, flt-scene-host');
      }

      // FIX (Aug 11 2026 — Nizam's "2nd open pannumbothu 2 type
      // animations varuthu, app slow feel aaguthu"): this HTML splash is
      // SEPARATE from the Flutter-side splash video (which we already
      // made first-launch-only in main_customer.dart). It used to render
      // the full branded screen — logo, title, subtitle, spinner AND a
      // status line cycling through 4 different messages every 800ms — on
      // EVERY single PWA open. Two of those messages ("Loading
      // resources...", "Almost ready...") are exactly the two "different
      // animations" reported, and the cycling text is what makes a fast
      // boot still FEEL slow: motion on screen reads as "still working".
      //
      // Repeat opens now get a bare, static splash: same background so
      // there's no white flash, but no logo, no text, no spinner, no
      // interval timer. Flutter still needs a moment to boot (we can't
      // remove that), but nothing animates, so it reads as instant rather
      // than as a loading screen. The full branded splash is preserved
      // for the first-ever visit, where it's genuinely doing useful work
      // covering a cold download.
      var isRepeatVisit = false;
      try {
        isRepeatVisit = localStorage.getItem('allin1_web_splash_seen') === '1';
        localStorage.setItem('allin1_web_splash_seen', '1');
      } catch (e) {
        // localStorage blocked (private mode / strict settings) — fall
        // back to the full splash rather than breaking boot.
        isRepeatVisit = false;
      }

      var statusInterval = null;
      if (splash) splash.classList.add('coldboot');

      // The animated, branded experience runs on every visit now.
      var statuses = ['Initializing...', 'Loading resources...', 'Preparing app...', 'Almost ready...'];
      var index = 0;
      statusInterval = setInterval(function () {
        index = (index + 1) % statuses.length;
        if (status) status.textContent = statuses[index];
      }, 800);

      // Hide splash when Flutter is ready
      window.addEventListener('flutter-first-frame', function () {
        firstFrameFired = true;
        window.__a1FirstFrame = true;
        clearInterval(statusInterval);

        // HARDENED (Aug 11 2026): on a REPEAT visit tear the splash down
        // synchronously — no fade, no 400ms transition, no extra frame.
        // The splash exists on repeat boots only to cover main.dart.js
        // parse; the instant that's done it must be gone, not gracefully
        // dissolving. Returning early also skips the 400ms setTimeout
        // below entirely.
        if (isRepeatVisit) {
          if (splash) {
            splash.classList.add('instant-hide');
            splash.style.display = 'none';
          }
          return;
        }

        // Cold boot only: let the shuffle settle rather than being cut
        // mid-animation.
        if (splash) splash.classList.add('resolving');
        if (splash) {
          splash.classList.add('hidden');
          splash.classList.remove('visible');
          setTimeout(function () {
            splash.style.display = 'none';
          }, 400);
        }
      }, { once: true });

      // FIX (black/white-screen-stuck audit, per Nizam's request): this
      // used to unconditionally HIDE the splash after 8 seconds no
      // matter what — including when Flutter genuinely failed to boot
      // (slow/dropped network mid-download on a weak Erode connection,
      // a JS exception, low-memory phone killing the tab's script).
      // Since <body> has no background color of its own, hiding the
      // splash in that failure case left a literally blank white page
      // with NO error, NO retry — just silence forever, matching
      // exactly what Nizam reported ("black/white screen la
      // ninnuruthu"). Now: if flutter-first-frame never fired by 8s,
      // keep the splash visible and swap the loader for a Retry button
      // instead of hiding into a dead page.
      setTimeout(function () {
        // Guarded by flutterHasPainted(), not the local flag alone — the
        // flag could be stale if the event fired before this script ran.
        if (flutterHasPainted()) return;
        clearInterval(statusInterval);
        if (status) status.textContent = 'Taking longer than usual to load.';
        if (retryBtn) {
          retryBtn.style.display = 'inline-block';
          retryBtn.addEventListener('click', function () {
            window.location.reload();
          });
        }
      }, 8000);

      // ── PWA BACK-BUTTON GUARD ──────────────────────────────────
      // FIX (Aug 11 2026 — Nizam: "mobile la iruka back option press
      // panni back pona app close agi reopen aguthu apayum splash
      // varrathunala delay aaguthu"):
      //
      // ROOT CAUSE: in an installed PWA, Android's hardware Back maps to
      // browser Back. Flutter pushes a browser-history entry for NAMED
      // routes, but most of this app navigates with Navigator.push() +
      // MaterialPageRoute, which does NOT add one. So browser history
      // often holds just the single initial entry — meaning the very
      // first hardware-Back press navigates AWAY from the app entirely,
      // closing the PWA. Reopening then pays the full cold-boot cost
      // (splash + Flutter bootstrap), which is the delay reported. The
      // in-app back arrow was unaffected because it drives Flutter's own
      // Navigator directly, never touching browser history — exactly
      // matching "screen back button works, phone back button doesn't".
      //
      // FIX: seed one extra history entry at boot, and on every popstate
      // immediately push it back. Hardware Back then always lands on our
      // sentinel instead of exiting, and Flutter's own PopScope handlers
      // (see dashboard_screen.dart's exit-confirmation dialog) stay in
      // control of what Back actually means. Deliberately NOT applied to
      // plain browser tabs — only to the installed/standalone PWA, since
      // trapping Back in a normal tab would break the user's expectation
      // of navigating back to whatever page they came from.
      try {
        var isStandalone =
          window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true;
        if (isStandalone) {
          history.pushState({ allin1Guard: true }, '');
          window.addEventListener('popstate', function () {
            // Re-arm the sentinel so the next Back press is also caught.
            history.pushState({ allin1Guard: true }, '');
          });
        }
      } catch (e) {
        // History API unavailable — degrade to previous behaviour rather
        // than breaking boot.
      }

      setTimeout(function () {
        if (!flutterHasPainted()) {
          console.warn('[PWA] App is taking exceptionally long to boot. Waiting for user to click Retry if needed.');
        }
      }, 20000);
    })();
  </script>

  <!-- ── PWA Auto-Update: Force fresh code on new deploy ──────────── -->
  <script>
    // ── WebGL context loss recovery: force repaint on resume ──
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        window.dispatchEvent(new Event('resize'));
      }
    });

    // ── Update detection lives in Dart now ──────────────────────────
    //
    // This block used to watch service-worker update events and set
    // window.allin1UpdateAvailable for the in-app UPDATE button to
    // read. That approach is dead:
    //
    //   * Flutter's current service worker UNREGISTERS ITSELF on
    //     activate (verified on the deployed file) and has no fetch
    //     handler, so it can never report an update.
    //   * `--pwa-strategy` is deprecated and being removed, so
    //     service-worker caching is not something to build on.
    //
    // The console showed the consequence directly:
    //   "[PWA] update check failed: InvalidStateError: Failed to
    //    update a ServiceWorker ... The object is in an invalid state."
    //
    // web_version_checker.dart now compares /version.json against the
    // build this tab loaded with. No service worker involved, nothing
    // deprecated, identical behaviour on every Flutter version.
    //
    // flutter_service_worker.js is still NOT registered here — it has
    // no fetch handler and self-unregisters on activate, and that
    // self-unregister ALSO force-navigates/reloads every client it
    // controls, which caused a mobile blank-screen-after-update bug
    // right after a fresh deploy. Still never registered.
    //
    // FIX (Aug 8 2026 — "namma pwa vayum mobile app mari... net ilana
    // open agamattingithu"): pwa_fallback_sw.js used to be genuinely
    // inert (fetch listener registered but never respondWith()'d, zero
    // caching) purely to satisfy Chrome's installability check while
    // side-stepping the stale-cache bug above. It now does real,
    // network-first offline caching of the app shell — see that file's
    // own top-of-file comment for exactly how it avoids reintroducing
    // either the stale-forever bug or the force-reload-mid-boot bug.
    // Net effect: online behaviour is unchanged (always the freshest
    // deploy), but the app shell now also opens with zero network,
    // like an installed native app.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        // ROOT CAUSE FIX (Aug 8 2026) — "selfie camera MissingPluginException
        // persists even after a completely fresh rebuild + redeploy".
        //
        // The comments above explain why flutter_service_worker.js is no
        // longer *registered* going forward. What they missed: any
        // browser/device that visited this site BEFORE that change was
        // made already has that old worker installed, active, and
        // controlling every navigation on this origin. A service worker's
        // fetch handler intercepts requests BEFORE they ever reach the
        // network or respect Cache-Control headers — so Firebase Hosting's
        // "no-cache" header on main.dart.js (see firebase.json) is
        // completely bypassed. The old worker just keeps serving its own
        // precached main.dart.js from whatever build was live when it was
        // installed, forever, on that one device — regardless of how many
        // times the app gets rebuilt and redeployed, and regardless of a
        // manual hard-reload (a controlling service worker survives those
        // too; only DevTools "Unregister" or Clear Site Data removes it).
        // That precached bundle can predate camera/image_picker even being
        // added to pubspec.yaml, which is exactly the MissingPluginException
        // signature reported here.
        //
        // Fix: self-heal on load. Enumerate every registration for this
        // origin and unregister anything that ISN'T pwa_fallback_sw.js —
        // this only ever needs to fire once per affected device, after
        // which only the intentionally-inert fallback worker remains.
        //
        // FIX (Aug 10 2026 — root cause of "Hero PWA never receives
        // background ride/service pings"): this loop used to treat
        // firebase-messaging-sw.js (which did not exist as a file until
        // this same fix) the same as any other "stale" worker and
        // unregistered it on every page load, before it ever had a
        // chance to receive a push. Carved out an explicit exception —
        // this is the ONLY other worker this origin intentionally runs.
        navigator.serviceWorker.getRegistrations().then((regs) => {
          for (const reg of regs) {
            const url = reg.active?.scriptURL || reg.waiting?.scriptURL || reg.installing?.scriptURL || '';
            if (!url.endsWith('/pwa_fallback_sw.js') && !url.endsWith('/firebase-messaging-sw.js')) {
              console.warn('[PWA] Unregistering stale service worker:', url);
              reg.unregister();
            }
          }
        }).catch((err) => {
          console.warn('[PWA] Could not enumerate service worker registrations:', err);
        });

        navigator.serviceWorker.register('/pwa_fallback_sw.js')
          .catch(err => console.warn('[PWA] fallback service worker registration failed:', err));

        // FIX (same root cause as above): firebase-messaging-sw.js must
        // be explicitly registered too — Firebase Messaging's web SDK
        // does NOT auto-register it, unlike some other Firebase web
        // features. Registered at the default scope ('/'), same as
        // pwa_fallback_sw.js; both can coexist since Firebase Messaging
        // only intercepts push events, never fetch, so there is no
        // routing conflict between the two workers.
        navigator.serviceWorker.register('/firebase-messaging-sw.js')
          .catch(err => console.warn('[PWA] firebase-messaging-sw.js registration failed:', err));
      });
    }
  </script>
