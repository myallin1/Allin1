org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m

# BUILD SPEED (Aug 17 2026 — Nizam: "romba neram build aguthu").
# Gradle defaults these to OFF, which is why every build re-does work it
# already did. All three are safe and standard for a Flutter project:
#   parallel  — build independent modules at the same time instead of
#               one after another (this project pulls in a lot of
#               plugin modules: firebase, sentry, maps, qr, cropper...).
#   caching   — reuse task outputs from previous builds instead of
#               recompiling unchanged code.
#   kotlin.incremental — only recompile the Kotlin files that changed
#               (MainActivity.kt etc.), not the whole source set.
# None of these change what is built, only how much is re-done.
org.gradle.parallel=true
org.gradle.caching=true
kotlin.incremental=true

android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
