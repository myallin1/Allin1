# ================================================================
# flutter_native_splash Ã¢â‚¬â€ ONE first frame, everywhere
# ================================================================
# Regenerate after ANY change here:
#     dart run flutter_native_splash:create
#
# WHY EVERY KEY BELOW IS SET EXPLICITLY
# The bug being fixed was inconsistency, so nothing is left to a
# default that could differ between Android versions or themes:
#
#   color / color_dark  Ã¢â‚¬â€ the SAME white in both. Without color_dark,
#                         values-night keeps its own dark background and
#                         the splash flips colour with the system theme.
#   android_12          Ã¢â‚¬â€ Android 12+ uses a separate SplashScreen API
#                         and IGNORES the legacy drawable. Configuring
#                         this block is what stops new phones falling
#                         back to the bare launcher icon.
#   web: false          Ã¢â‚¬â€ the PWA already has its own hand-built splash
#                         in web/index.html (logo + saffron/green glow +
#                         spinner). Letting this package overwrite it
#                         would throw that away.
#
# The tricolour side-glow and the loading text/spinner Nizam asked for
# live in the FLUTTER splash (branded_loading_screen.dart), not here.
# A native splash is a static image the OS draws before Dart starts Ã¢â‚¬â€
# it cannot animate or run our gradient. Keeping this frame identical
# in colour to that screen is what makes the handover invisible.
flutter_native_splash:
  color: "#FDFDFD"
  color_dark: "#FDFDFD"
  image: assets/splash/splash_logo.png
  image_dark: assets/splash/splash_logo.png
  android: true
  ios: true
  web: false
  android_gravity: center
  ios_content_mode: center
  fullscreen: false

  android_12:
    color: "#FDFDFD"
    color_dark: "#FDFDFD"
    image: assets/splash/splash_logo.png
    image_dark: assets/splash/splash_logo.png
    # Android 12 masks the splash icon into a circle and reserves the
    # outer third for that mask, so art sized for the legacy splash
    # gets visibly clipped. This is the documented safe size.
    icon_background_color: "#FDFDFD"
    icon_background_color_dark: "#FDFDFD"
