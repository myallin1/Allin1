name: erode_superapp
description: Erode All-in-One Super App - Multi-vendor Commerce MVP by NJ TECH
publish_to: 'none'
version: 1.0.9+105

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  bcrypt: ^1.1.3
  cloud_firestore: ^6.1.3
  cloud_functions: ^6.0.7
  crypto: ^3.0.3
  cupertino_icons: ^1.0.8
  colorful_iconify_flutter: ^0.0.5
  flutter_svg: ^2.3.0
  # MyAllin1 Super Hero — spoken clarifying questions for the Voice-to-Order
  # disambiguation flow (e.g. "Did you mean an Auto to Erode Railway
  # Station?"). Pinned to a long-stable 4.x release rather than latest,
  # since we can't run `flutter pub get` in this sandbox to verify a
  # newer release against.
  flutter_tts: ^4.0.2
  dio: ^5.4.0
  encrypt: ^5.0.3
  file_picker: ^8.1.2
  # NEW (CTO mandate — Advanced KYC & Facial Verification): file_picker
  # above only opens the gallery/file browser (no way to force a LIVE
  # camera capture, and no camera option at all on web). image_picker's
  # ImageSource.camera opens the actual camera on every platform this
  # app ships to (Android/iOS/web via <input capture>), which is what
  # a genuine "live selfie" requires. Used only in hero_register_screen.dart.
  image_picker: ^1.1.2
  # NEW (per Nizam's request — live selfie with round-box face guide):
  # image_picker's ImageSource.camera opens the OS's native camera app,
  # which Flutter can't draw a custom oval overlay on top of. The
  # `camera` package gives an embedded, in-app live preview instead
  # (works on Android/iOS/web via the bundled camera_web plugin), so
  # selfie_capture_screen.dart can paint a face-guide oval directly over
  # it. Used only by selfie_capture_screen.dart (hero_register_screen.dart's
  # live selfie step). Run `flutter pub get` after this change.
  camera: ^0.11.0+2
  firebase_analytics: any
  firebase_auth: ^6.2.0
  firebase_core: ^4.5.0
  firebase_crashlytics: any
  firebase_database: ^12.1.4
  firebase_messaging: ^16.1.2
  firebase_performance: any
  firebase_storage: ^13.1.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.0
  flutter_dotenv: ^5.1.0
  flutter_map: ^8.2.2
  # Ola Maps Vector Tiles surgical integration: real MapLibre-style vector
  # rendering plugged into our existing flutter_map/TileLayer stack. Pinned
  # to 9.0.0-beta.8 -- the package's own docs name only 8.0.0 and
  # 9.0.0-beta.8 as production-ready, and 8.0.0 needs flutter_map ^7.0.2
  # which conflicts with our pinned ^8.2.2 above. 9.0.0-beta.8 needs
  # flutter_map ^8.1.1, which is satisfied. Do NOT bump to 10.x -- that line
  # requires the experimental flutter_gpu renderer + Flutter's `main` dev
  # channel and is explicitly documented as not for production.
  vector_map_tiles: ^9.0.0-beta.8
  # Already a transitive dep of vector_map_tiles 9.0.0-beta.8 (which pins
  # ^6.0.0) -- declared directly too because allin1_map_widget.dart now
  # calls vector_tile_renderer's ThemeReader() itself (see the
  # _buildOlaStyleManually() comment for why: Ola's style JSON doesn't
  # support vmt.StyleReader's built-in {key}-token substitution, so we
  # build the Style by hand and only reuse this package's theme parser).
  vector_tile_renderer: ^6.0.0
  flutter_markdown: ^0.6.22
  flutter_ringtone_player: ^4.0.0+4
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.2.2
  geocoding: ^4.0.0
  geolocator: ^13.0.2
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.2.1
  # Pure-Dart image decode/resize/re-encode — works on web (no platform
  # channels), used to compress photos client-side before uploading to
  # Cloudinary so we don't ship full-resolution camera photos over the
  # wire. See cloudinary_upload_service.dart.
  image: ^4.2.0
  intl: ^0.19.0
  latlong2: ^0.9.1
  package_info_plus: ^9.0.0
  permission_handler: ^11.3.1
  pointycastle: ^3.9.1
  provider: ^6.1.2
  # Reads the payload of an Android share (ACTION_SEND) so a location
  # shared in from WhatsApp/Maps reaches the app. Android+iOS only; the
  # PWA gets the same feature through manifest.json's "share_target",
  # which needs no plugin. See shared_location_inbox.dart.
  receive_sharing_intent: ^1.8.1
  lottie: ^3.1.0
  scratcher: ^2.5.0
  shorebird_code_push: ^2.0.5
  speech_to_text: ^7.3.0
  url_launcher: ^6.3.2
  uuid: ^4.4.0
  web: ^1.1.0
  open_filex: ^4.7.0
  path_provider: ^2.1.5
  flutter_local_notifications: ^21.0.0
  # NEW (CTO mandate — FCM Layer 2 alternative, Option D): Android
  # foreground service so the Hero app's process (and therefore the
  # existing in-process RTDB hero_pings/hero_service_pings listeners in
  # main_hero.dart/hero_home_screen.dart) survives being backgrounded
  # while a hero is Online, instead of the OS killing it and silently
  # losing Layer 1 dispatch. Shows the required persistent "You are
  # Online" notification while active. Android-only usage (see
  # hero_foreground_service.dart) — other flavors (Customer/Seller/
  # Admin) never call into this. Run `flutter pub get` after this
  # change; verify the pinned version against pub.dev, since this
  # sandbox can't run pub get to confirm it resolves.
  flutter_foreground_task: ^8.13.0
  audioplayers: ^6.6.0
  video_player:
  carousel_slider:
  sentry_flutter: ^8.14.2
  # Native (Android/iOS) embedded WebView for the in-app DMart e-menu
  # screen -- has no web implementation, so dmart_screen.dart switches
  # to a real <iframe> on web instead (see dmart_embedded_view_web.dart).
  # Run `flutter pub get` after this change before building.
  webview_flutter: ^4.7.0
  # FIX (DMart WebView OTP session fix): needed directly (not just
  # transitively via webview_flutter) so dmart_embedded_view_native.dart
  # can import AndroidWebViewController/AndroidWebViewCookieManager to
  # explicitly enable third-party cookies for DMart's OTP-login flow.
  # Already resolves via pubspec.lock (4.13.0 as of this change) -- this
  # just makes the dependency direct/explicit instead of transitive.
  webview_flutter_android: ^4.0.0

dev_dependencies:
  build_runner: ^2.4.8
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  # NEW (CTO mandate — Synthetic QA Test-Bot): SDK-bundled, no version
  # pinning risk, dev-only — never ships in the release build. Drives
  # the app the same way a real user would (see integration_test/), for
  # the 5-screen QA bot per QA_AGENT_BLUEPRINT.md.
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansTamil
      fonts:
        - asset: fonts/NotoSansTamil-Regular.ttf
          weight: 400
        - asset: fonts/NotoSansTamil-Regular.ttf
          weight: 500
        - asset: fonts/NotoSansTamil-Regular.ttf
          weight: 600
        - asset: fonts/NotoSansTamil-Regular.ttf
          weight: 700
  assets:
    - .env
    - assets/
    - assets/images/
    - assets/images/printing/
    - assets/videos/
    - assets/sounds/
    - shorebird.yaml

  # PWA / Web
  # Ensure web/index.html has: <meta name="theme-color" content="#0A0A12">
