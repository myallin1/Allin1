name: Gemini AI CTO Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  cto-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get PR Diff
        id: pr_diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > diff.txt
          echo "DIFF_SIZE=$(wc -c < diff.txt)" >> $GITHUB_ENV

      - name: Run Gemini CTO Audit
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        with:
          script: |
            const fs = require('fs');
            const apiKey = process.env.GEMINI_API_KEY;
            
            if (!apiKey) {
              console.log('GEMINI_API_KEY secret is not set. Skipping CTO review.');
              return;
            }

            let diff = '';
            try {
              diff = fs.readFileSync('diff.txt', 'utf8');
            } catch (e) {
              console.log('No diff found:', e);
              return;
            }

            if (!diff.trim()) {
              console.log('Diff is empty. Skipping.');
              return;
            }

            // Truncate diff if extremely large to prevent payload overflow
            if (diff.length > 50000) {
              diff = diff.substring(0, 50000) + '\n... [Diff truncated for token limits]';
            }

            let agentsMd = '';
            try {
              agentsMd = fs.readFileSync('AGENTS.md', 'utf8').substring(0, 15000);
            } catch (_) {}

            const prompt = `You are the AI Chief Technology Officer (CTO) of the Allin1 Super App (Erode, Tamil Nadu).
            A pull request was just submitted by developer @${process.env.PR_AUTHOR} titled: "${process.env.PR_TITLE}".

            Here are our core architectural contracts from AGENTS.md:
            ${agentsMd}

            Here is the code diff of this Pull Request:
            \`\`\`diff
            ${diff}
            \`\`\`

            Perform a thorough CTO Code Review and output a structured Markdown report formatted as follows:
            
            ### 🏛️ Gemini AI CTO Code Review Report
            **PR:** #${process.env.PR_NUMBER} - ${process.env.PR_TITLE}
            **Author:** @${process.env.PR_AUTHOR}

            #### 1. 🔍 Architecture & Zero-Breakage Audit
            (Check if layouts, SingleChildScrollView, state management, or contracts are respected)

            #### 2. 🔒 Security & Privacy Review
            (Check for exposed secrets, OTP/PIN leakages, unauthenticated storage URLs, or permission issues)

            #### 3. ⚡ Cost & Spark Plan Discipline
            (Check for unbounded Firestore queries, Blaze-only dependencies, or heavy cloud compute)

            #### 4. 🎨 UI/UX & Brand Identity
            (Verify Premium Pink & White #D81B60 theme, rounded corners 16-24, PhonePe/Spotify standard)

            ---
            ### 🏁 CTO Final Verdict
            **Status:** [✅ APPROVED TO MERGE / 🟡 APPROVED WITH MINOR SUGGESTIONS / 🔴 CHANGES REQUESTED]
            **Executive Summary:** (2-3 concise sentences in Tamil and English giving the founder clear guidance)
            `;

            try {
              const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
              const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{ role: 'user', parts: [{ text: prompt }] }],
                  generationConfig: { temperature: 0.2, maxOutputTokens: 2000 }
                })
              });

              const data = await response.json();
              const reviewText = data.candidates?.[0]?.content?.parts?.[0]?.text;

              if (reviewText) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body: reviewText
                });
                console.log('Successfully posted Gemini CTO review comment.');
              } else {
                console.log('No review output from Gemini:', JSON.stringify(data));
              }
            } catch (err) {
              console.error('Failed to run Gemini CTO Review:', err);
            }
