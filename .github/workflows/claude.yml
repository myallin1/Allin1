name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    # FIX (Sep 2 2026): contents/pull-requests were read-only, so
    # Claude Code could plan a fix but could not push a branch or open
    # a PR — confirmed by a live run that passed the trigger check,
    # ran, and failed with is_error:true plus "HttpError: Not Found"
    # from a git-compare call, with GITHUB_TOKEN Permissions in the job
    # log showing only Contents: read / PullRequests: read. write is
    # exactly what "opens a PR" requires; issues stays read since this
    # workflow only reacts to issues, never edits them.
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # FIX (Sep 2 2026): was `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}`
          # -- that's a separate, pay-per-token key from console.anthropic.com,
          # which this account never had (only a Claude.ai Pro subscription,
          # not API billing) -- so every run of this workflow failed.
          # claude_code_oauth_token authenticates with that Pro/Max subscription
          # instead: run `claude setup-token` locally while logged in, then save
          # the printed token as the CLAUDE_CODE_OAUTH_TOKEN repo secret.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'

