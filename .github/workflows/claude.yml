name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # FIX (Sep 2 2026): was `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}`
          # -- that's a separate, pay-per-token key from console.anthropic.com,
          # which this account never had (only a Claude.ai Pro subscription,
          # not API billing) -- so every run of this workflow failed.
          # claude_code_oauth_token authenticates with that Pro/Max subscription
          # instead: run `claude setup-token` locally while logged in, then save
          # the printed token as the CLAUDE_CODE_OAUTH_TOKEN repo secret.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # NEW (Sep 2 2026 — Nizam: "claude 2 model ah vachu... sonnet ah
          # coding ku set pannirlaam" — moving off Gemini as CTO reviewer
          # since its free-tier quota ran out, onto two Claude models
          # instead: Sonnet does the coding here, Haiku audits in
          # claude-code-review.yml). Pinned explicitly rather than relying
          # on the action's current default, so a future default change
          # upstream can't silently switch which model writes the code.
          claude_args: '--model claude-sonnet-5'

