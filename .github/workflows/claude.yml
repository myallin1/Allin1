name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    # FIX (Sep 2 2026, superseding PR #23): contents/pull-requests were
    # read-only, so Claude could plan a fix but never push a branch or
    # open a PR -- confirmed by a live run (issue #22) that got past
    # the trigger check, ran, and failed with is_error:true plus
    # "HttpError: Not Found" from a git-compare call, with GITHUB_TOKEN
    # Permissions in the job log showing only read access.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # FIX (Sep 2 2026): was `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}`
          # -- that's a separate, pay-per-token key from console.anthropic.com,
          # which this account never had (only a Claude.ai Pro subscription,
          # not API billing) -- so every run of this workflow failed.
          # claude_code_oauth_token authenticates with that Pro/Max subscription
          # instead: run `claude setup-token` locally while logged in, then save
          # the printed token as the CLAUDE_CODE_OAUTH_TOKEN repo secret.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # REVERTED (Sep 2 2026): pinning --model claude-sonnet-5 broke
          # this workflow -- a live run (issue #29) showed the model
          # accepted at init ("model": "claude-sonnet-5") but then
          # failing immediately after with is_error:true, num_turns:1,
          # total_cost_usd:0 -- consistent with "claude-sonnet-5" being
          # this chat product's own short internal name rather than a
          # real, resolvable Anthropic API model identifier the CLI can
          # actually call. claude-code-action's own docs give full
          # dated IDs as examples (e.g. claude-3-7-sonnet-20250219),
          # not short aliases. The action's documented default is
          # already Sonnet, so omitting claude_args here still gives
          # Nizam's "Sonnet does the coding" without guessing at an
          # exact dated ID. (claude-haiku-4-5-20251001 in
          # claude-code-review.yml is a real, confirmed-working ID --
          # that one stays as-is.)


