name: Aider DeepSeek Assistant

on:
  issue_comment:
    types: [created]

jobs:
  aider-agent:
    timeout-minutes: 10
    if: contains(github.event.comment.body, '@aider')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: dev-nijam
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider
        run: pip install aider-chat

      - name: Configure git
        run: |
          git config user.name "aider-bot"
          git config user.email "aider-bot@users.noreply.github.com"

      - name: Create branch
        run: git checkout -b agent/issue-${{ github.event.issue.number }}-fix-${{ github.run_number }}

      - name: Run Aider with DeepSeek
        timeout-minutes: 6
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          # Load the rule files into aider's context (read-only) so the model
          # actually follows them - a plain "read GEMINI.md" in the message does
          # NOT make aider open them, which is why earlier runs edited ruleless.
          # The request text is passed via env + a message file (not inline) so
          # nothing in the comment can be interpreted as shell.
          cat > /tmp/aider_msg.txt <<'PROMPT_EOF'
          You are a careful Flutter engineer on the Allin1 super app (NJ Tech,
          Erode). The rules in GEMINI.md and AGENTS.md (both loaded read-only)
          are binding.

          HOW TO WORK
            - Work search-first: grep/glob to LOCATE the exact code, then read
              only the matched regions. Do not read broadly (27,000+ files).
            - Make the SMALLEST change that genuinely fixes the request. Aim to
              touch 1-3 files.

          HARD RULES - never break these
            - Never touch payments, wallets, PhonePe, authentication, KYC, or
              firestore.rules.
            - Never rewrite or delete an entire file or section. Apply exact,
              localized edits to the specific lines only.
            - Never change or remove existing working behaviour the request did
              not ask about.
            - Never invent a feature, screen or API you have not verified exists
              by grepping for it.

          THE REQUEST:
          PROMPT_EOF
          printf '%s\n' "$COMMENT_BODY" >> /tmp/aider_msg.txt
          aider --yes --model deepseek/deepseek-chat --no-check-update \
            --read GEMINI.md --read AGENTS.md \
            --message-file /tmp/aider_msg.txt

      - name: Commit any remaining changes
        run: |
          git add -A
          git diff --staged --quiet || git commit -m "fix: automated change via Aider + DeepSeek for issue #${{ github.event.issue.number }}"

      - name: Push branch
        run: git push origin agent/issue-${{ github.event.issue.number }}-fix-${{ github.run_number }}

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --base dev-nijam --head agent/issue-${{ github.event.issue.number }}-fix-${{ github.run_number }} --title "Fix issue #${{ github.event.issue.number }}" --body "Automated fix via Aider + DeepSeek"
