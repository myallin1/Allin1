name: Sentry Auto-Fix Draft

# Triggers whenever a GitHub issue is labeled "sentry-bug" (either by
# Sentry's GitHub integration, or by playwright-smoke.yml auto-filing
# a failure). Runs Gemini CLI to draft a candidate fix as a pull
# request. Never auto-merges — a human always reviews before merge.

on:
  issues:
    types: [labeled]

jobs:
  draft-fix:
    if: github.event.label.name == 'sentry-bug'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli

      - name: Draft fix branch
        # FIX (Sep 2 2026): this step had TWO `env:` keys (one here, one
        # after the `run:` block below) — a duplicate mapping key that
        # made GitHub reject the whole workflow file outright (every run
        # showed 0 jobs, name fell back to the file path). Merged into
        # the one `env:` a step is actually allowed to have.
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "gemini-autofix-bot"
          git config user.email "gemini-autofix-bot@users.noreply.github.com"
          BRANCH="agent/issue-${ISSUE_NUMBER}-autofix-$(date +%s)"
          git checkout -b "$BRANCH"
          echo "Issue: $ISSUE_TITLE" > .gemini-issue-context.txt
          echo "$ISSUE_BODY" >> .gemini-issue-context.txt
          gemini --prompt "Read .gemini-issue-context.txt for the reported bug. Investigate the Flutter/Dart codebase under lib/ and propose the smallest safe fix. Apply the fix directly to the relevant file(s). Do not touch unrelated files." || true
          rm -f .gemini-issue-context.txt
          git add -A
          if git diff --cached --quiet; then
            echo "No changes produced by Gemini — skipping PR."
            exit 0
          fi
          git commit -m "fix: automated draft fix for issue #${ISSUE_NUMBER} via Gemini CLI"
          git push origin "$BRANCH"
          gh pr create \
            --title "Draft fix for #${ISSUE_NUMBER}: ${ISSUE_TITLE}" \
            --body "Automated draft fix generated by Gemini CLI in response to issue #${ISSUE_NUMBER}. **Requires human review before merge.**" \
            --head "$BRANCH" \
            --base test-2-consolidated-all
