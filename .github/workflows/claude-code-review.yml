name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        # FIX (Sep 2 2026): the code-review@claude-code-plugins
        # marketplace plugin has an internal bug unrelated to this
        # repo's content -- it walks up from its own entry file for a
        # tsconfig.json and hits a Bun runtime "directory mismatch"
        # error, confirmed failing identically across every PR this
        # session regardless of what changed (a Flutter/Dart repo has
        # no tsconfig.json for it to find in the first place). This is
        # a secondary, informational review layer -- cto-review and
        # Run Tests are the gates that actually mean something for
        # this repo -- so a plugin-internal crash here should not
        # block an otherwise-clean PR from merging.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          # FIX (Sep 2 2026): was `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}`
          # -- that's a separate, pay-per-token key from console.anthropic.com,
          # which this account never had (only a Claude.ai Pro subscription,
          # not API billing) -- so every run of this workflow failed.
          # claude_code_oauth_token authenticates with that Pro/Max subscription
          # instead: run `claude setup-token` locally while logged in, then save
          # the printed token as the CLAUDE_CODE_OAUTH_TOKEN repo secret.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

