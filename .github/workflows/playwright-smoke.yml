name: Playwright Smoke Test

# Runs every 6 hours + can be triggered manually. Checks all 4 live
# Allin1 apps (customer, hero, admin, seller) load without JS errors.
# On failure, auto-files a GitHub issue labeled "sentry-bug" so the
# sentry-autofix.yml workflow picks it up and drafts a fix PR.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright deps
        working-directory: playwright-tests
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run smoke tests
        id: smoke
        working-directory: playwright-tests
        run: npx playwright test tests/smoke/app-load.spec.ts
        continue-on-error: true

      - name: File issue on failure
        if: steps.smoke.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Smoke test failure — ${new Date().toISOString()}`,
              body: "Automated Playwright smoke test detected one or more Allin1 apps failed to load cleanly. See the failed workflow run for details.",
              labels: ["sentry-bug"],
            });

      - name: Fail job if smoke test failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
