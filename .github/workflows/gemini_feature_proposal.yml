name: Gemini Feature Proposal

# NEW (Sep 2 2026 — Nizam: "ipove geminiyum claude um work
# arambikanum... namma new feauture conitue va develop pannuvanga").
#
# The rest of the pipeline already existed before this file: Gemini
# reviews PRs (gemini_cto_review.yml / cto-review), Claude Code
# implements issues tagged @claude (claude.yml), and Claude's own PRs
# get reviewed the same way. What was missing was the FIRST step —
# something proposing what to build next, so the loop can run without
# Nizam typing the next request himself.
#
# This job is that first step, and only that step: it asks Gemini for
# ONE small, safe, additive feature idea and opens it as a GitHub issue
# tagging @claude — the existing claude.yml then picks it up, opens a
# PR, and cto-review reviews it, exactly like a human-filed issue would
# flow through today. Nothing here merges anything or bypasses review.
#
# SAFETY, ON PURPOSE
#   - Explicitly told to avoid payments, auth, KYC, security rules, and
#     anything money-moving — see the prompt below. A background loop
#     proposing changes to those is the wrong kind of autonomous.
#   - Capped to one proposal per run, and skips entirely if there are
#     already 3+ open issues from this workflow still unaddressed —
#     otherwise a stuck Claude run would let these pile up unbounded
#     overnight.
#   - schedule + workflow_dispatch: runs on its own, but can also be
#     fired by hand from the Actions tab without waiting for the clock.
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  propose-feature:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Count unaddressed proposals
        id: count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh issue list --repo "${{ github.repository }}" --label "chitti-proposed" --state open --json number --jq 'length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Open unaddressed chitti-proposed issues: $count"

      - name: Ensure the chitti-proposed label exists
        if: fromJSON(steps.count.outputs.count) < 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh label create chitti-proposed --color BFD4F2 --description "Feature proposed by the Gemini Feature Proposal workflow" --force

      - name: Setup Node
        if: fromJSON(steps.count.outputs.count) < 3
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Gemini CLI
        if: fromJSON(steps.count.outputs.count) < 3
        run: npm install -g @google/gemini-cli

      - name: Propose one feature and open an issue
        if: fromJSON(steps.count.outputs.count) < 3
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gemini --prompt "You are the CTO for the Allin1 Flutter super app (NJ Tech, Erode) — read GEMINI.md and AGENTS.md first for context, and skim README/app_knowledge.dart if present. Propose exactly ONE small, safe, additive feature or UX improvement for the customer, hero, seller, or admin app that is not already implemented (check lib/ before proposing). Hard rules: never propose anything touching payments, wallets, PhonePe/payment gateways, authentication, KYC, firestore.rules, or anything that moves money or credentials — propose something else instead. Prefer something a single focused PR could deliver. Write the proposal as a GitHub issue: a short title and a body with (1) what it does, (2) why it's useful, (3) roughly which files/screens it touches, (4) explicit scope boundaries (what NOT to change). End the body with a line '@claude please implement this.' Then actually create the issue with: gh issue create --repo ${{ github.repository }} --title \"<title>\" --body \"<body>\" --label chitti-proposed" || true
