name: Gemini Feature Proposal

# NEW (Sep 2 2026 — Nizam: "ipove geminiyum claude um work
# arambikanum... namma new feauture conitue va develop pannuvanga").
#
# The rest of the pipeline already existed before this file: Gemini
# reviews PRs (gemini_cto_review.yml / cto-review), Claude Code
# implements issues tagged @claude (claude.yml), and Claude's own PRs
# get reviewed the same way. What was missing was the FIRST step —
# something proposing what to work on next, so the loop can run
# without Nizam typing the next request himself.
#
# CHANGED (Sep 2 2026 — Nizam: "ipo ful build vendam... entire app ah
# full audit panni athula iruka bugs and gapes mattum claude and
# gemini kitta audit panni solve panna sollalam, but existing irukura
# yentha feauture um disturb agakudathu"). Originally proposed NEW
# features; now it audits the EXISTING app for real bugs/gaps instead
# — a stuck STT loop, an unhandled null, a broken navigation case, a
# missing validation — and proposes the smallest fix that does not
# change any working behaviour. No new features from this workflow.
#
# This job is that first step, and only that step: it asks Gemini to
# find ONE real, confirmed bug or gap and opens it as a GitHub issue
# tagging @claude — the existing claude.yml then picks it up, opens a
# PR, and cto-review reviews it, exactly like a human-filed issue would
# flow through today. Nothing here merges anything or bypasses review.
#
# SAFETY, ON PURPOSE
#   - Explicitly told to avoid payments, auth, KYC, security rules, and
#     anything money-moving — see the prompt below. A background loop
#     proposing changes to those is the wrong kind of autonomous.
#   - Capped to one proposal per run, and skips entirely if there are
#     already 3+ open issues from this workflow still unaddressed —
#     otherwise a stuck Claude run would let these pile up unbounded
#     overnight.
#   - schedule + workflow_dispatch: runs on its own, but can also be
#     fired by hand from the Actions tab without waiting for the clock.
#
# UPDATED (Sep 2 2026 — Nizam: "ipove pesa arambichu, udanukkudane
# check panni work pannanum... satisfied aguravarayum panite
# irukanum" — wants this running continuously overnight, not once
# every 3 hours). Every 15 minutes is the shortest interval GitHub
# schedules reliably; this stays safe at that pace only because of the
# 3-open-proposal cap below — once 3 are waiting on Claude, every run
# in between is a no-op check, not a new issue.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  propose-feature:
    runs-on: ubuntu-latest
    # Gemini CLI refuses to act in a headless/CI directory unless told
    # it's trusted (confirmed by the first live run of this workflow:
    # "Gemini CLI is not running in a trusted directory" — it exited
    # without creating anything). gemini-dispatch.yml already sets this
    # the same way for its own Gemini CLI step.
    env:
      GEMINI_CLI_TRUST_WORKSPACE: 'true'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Count unaddressed proposals
        id: count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh issue list --repo "${{ github.repository }}" --label "chitti-proposed" --state open --json number --jq 'length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Open unaddressed chitti-proposed issues: $count"

      - name: Ensure the chitti-proposed label exists
        if: fromJSON(steps.count.outputs.count) < 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh label create chitti-proposed --color BFD4F2 --description "Bug/gap found by the Gemini audit workflow" --force

      - name: Setup Node
        if: fromJSON(steps.count.outputs.count) < 3
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Gemini CLI
        if: fromJSON(steps.count.outputs.count) < 3
        run: npm install -g @google/gemini-cli

      - name: Audit for one bug and open an issue
        if: fromJSON(steps.count.outputs.count) < 3
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gemini --prompt "You are the CTO auditing the Allin1 Flutter super app (NJ Tech, Erode) — read GEMINI.md and AGENTS.md first for context. Your job is AUDIT, not new features: search lib/ (and android/app/src for native code) for ONE real, confirmed bug or gap in EXISTING functionality — examples: a null/exception path that is not handled, a race condition, a broken or dead-end navigation flow, a missing input validation, a state that never resets, duplicated logic that has drifted out of sync, a TODO/FIXME that was never resolved. It must be a genuine defect you can point to in the actual code, not a guess and not a new feature or enhancement. Hard rules: (1) never propose touching payments, wallets, PhonePe/payment gateways, authentication, KYC, firestore.rules, or anything that moves money or credentials; (2) the fix must NOT change or remove any existing working behavior/feature — it only corrects the confirmed defect; (3) prefer something a single small, focused PR could safely fix. Write it up as a GitHub issue: a short title, and a body with (1) the exact bug — file/function and what goes wrong, (2) how you confirmed it is real (quote the relevant code), (3) the smallest safe fix, (4) explicit scope boundaries: what must NOT change. End the body with a line '@claude please fix this — do not change any other existing behavior.' Then actually create the issue with: gh issue create --repo ${{ github.repository }} --title \"<title>\" --body \"<body>\" --label chitti-proposed" || true
