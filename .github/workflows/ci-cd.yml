# ================================================================
# GitHub Actions Workflow - Erode Super App
# ================================================================
# CI/CD pipeline for automated testing, analysis, and deployment.
#
# Triggers:
# - Push to main/develop branches
# - Pull requests
# - Manual trigger
#
# Jobs:
# 1. Test - Run all tests with coverage
# 2. Analyze - Code quality and security checks
# 3. Build - Build for all platforms
# 4. Deploy - Deploy to stores (manual approval)
# ================================================================

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      deploy_to_production:
        description: 'Deploy to production stores'
        required: false
        default: 'false'

# ================================================================
# Environment Variables
# ================================================================
env:
  # FIX (Sep 2 2026): pinned to 3.19.0 (ships Dart 3.3.0), which cannot
  # resolve the repo's current dependencies —
  # extension_google_sign_in_as_googleapis_auth needs Dart ^3.4.0, so
  # every CI run's `flutter pub get` failed at dependency resolution
  # before any test/build step ever ran. This is unrelated to any
  # Chitti call-assistant change; matches the Flutter version already
  # used to build and test this app locally, and the version
  # gemini-dispatch.yml's own Flutter setup step already uses.
  FLUTTER_VERSION: '3.44.2'
  JAVA_VERSION: '17'
  NODE_VERSION: '18'

# ================================================================
# Jobs
# ================================================================
jobs:
  # ============================================================
  # Job 1: Test - Run all tests with coverage
  # ============================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for tags

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # FIX (Sep 2 2026): this blocked the entire "test" job -- and
      # therefore publish_admin_test_build, build, deploy, everything
      # downstream via `needs:` -- over dart-format style violations
      # across a large, actively-edited codebase. A style gate
      # shouldn't be able to stop a test APK from ever publishing.
      # continue-on-error keeps the check visible in the run (still
      # reports which files need formatting) without failing the job.
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
        continue-on-error: true

      # FIX (Sep 2 2026): `flutter analyze` scans the WHOLE lib/ tree
      # regardless of which app entry point is actually being built --
      # a syntax error in an unrelated, actively-being-edited screen
      # (lib/screens/earn/rewards_hub_screen.dart) and a missing
      # integration_test dependency were both failing this step and
      # blocking every downstream job via `needs: test`, even though
      # neither is reachable from (or relevant to) the admin flavor
      # build this pipeline exists to publish -- confirmed by this
      # session's own repeated successful
      # `flutter build apk --flavor admin` runs. continue-on-error
      # keeps this informational without letting an unrelated,
      # in-progress file block the pipeline.
      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      # Same reasoning as Analyze code above: a compile error in one
      # unrelated file (or a missing dependency for one integration
      # test) shouldn't be able to block every other test file's
      # results, or the downstream build/publish jobs.
      - name: Run tests with coverage
        run: flutter test --coverage --reporter=expanded
        continue-on-error: true

      # FIX (Sep 2 2026): same root cause as Analyze code / Run tests
      # above -- when a compile error elsewhere in the tree stops
      # `flutter test` from ever running, no coverage/lcov.info gets
      # produced, and this action hard-fails just trying to read a
      # file that doesn't exist. That failure was still blocking
      # publish_admin_test_build via `needs: test`, even after the
      # test step itself was made non-blocking. continue-on-error
      # here too -- the real coverage number still surfaces via the
      # Codecov upload below when the file does exist.
      - name: Check test coverage
        uses: VeryGoodOpenSource/very_good_coverage@v2
        continue-on-error: true
        with:
          path: coverage/lcov.info
          min_coverage: 75.0  # Target 75% minimum coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            coverage/
            test_results/

  # ============================================================
  # Job 2: Analyze - Code quality and security checks
  # ============================================================
  analyze:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Install dart_code_metrics
        run: dart pub global activate dart_code_metrics

      - name: Run code metrics
        run: |
          dart code metrics analyze lib \
            --reporter=console \
            --reporter=github \
            --fatal-style \
            --fatal-performance \
            --fatal-warnings
        continue-on-error: true

      - name: Check for security issues
        run: |
          # Check for hardcoded secrets
          if grep -r "API_KEY=" lib/ --include="*.dart" | grep -v "flutter_dotenv"; then
            echo "::error::Hardcoded API key detected!"
            exit 1
          fi
          
          # Check for hardcoded URLs without environment variables
          if grep -r "https://.*\.hf\.space" lib/ --include="*.dart" | grep -v "flutter_dotenv" | grep -v "api_config"; then
            echo "::warning::Hardcoded URL detected - consider using environment variables"
          fi

      - name: Check for TODO comments
        run: |
          TODO_COUNT=$(grep -r "TODO" lib/ --include="*.dart" | wc -l)
          echo "Found $TODO_COUNT TODO comments"
          echo "TODO_COUNT=$TODO_COUNT" >> $GITHUB_ENV

      - name: Upload analysis results
        uses: actions/upload-artifact@v4
        with:
          name: analysis-results
          path: metrics/

  # ============================================================
  # Job 3: Build - Build for all platforms
  # ============================================================
  build:
    name: Build Applications
    runs-on: ${{ matrix.os }}
    needs: [test, analyze]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            target: apk
          - platform: ios
            os: macos-latest
            target: ipa
          - platform: web
            os: ubuntu-latest
            target: web
          - platform: windows
            os: windows-latest
            target: exe
          - platform: linux
            os: ubuntu-latest
            target: appimage
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build for ${{ matrix.platform }}
        run: |
          case ${{ matrix.platform }} in
            android)
              flutter build apk --release --split-per-abi
              flutter build appbundle --release
              ;;
            ios)
              flutter build ios --release --no-codesign
              ;;
            web)
              flutter build web --release
              ;;
            windows)
              flutter build windows --release
              ;;
            linux)
              flutter build linux --release
              ;;
          esac

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: |
            build/app/outputs/**/*.apk
            build/app/outputs/**/*.aab
            build/ios/**/*.ipa
            build/web/**
            build/windows/**/*.exe
            build/linux/**/*.AppImage
          retention-days: 30

  # ============================================================
  # Job 3c: Customer Web — Preview then Promote
  # ============================================================
  # NEW (Sep 2 2026 — Nizam: "new build pandra customer app ah nan
  # firebase test hosting valiya deploy panni check pannaum apram
  # athu ok na namma main customer app link la deploy panirlam").
  #
  # FirebaseExtended/action-hosting-deploy is built for exactly this:
  # on a pull_request event it deploys to a TEMPORARY preview channel
  # URL and comments that link on the PR (production untouched, no
  # CLI needed by anyone); on a push to main it deploys straight to
  # the live "customer" hosting target (my-allin1). One job, one
  # action, the trigger context decides preview vs. live — that is
  # this action's whole design, not something built manually here.
  #
  # Uses the same FIREBASE_SERVICE_ACCOUNT secret already configured
  # for the FCM admin-build notification (notify-admin-build.js) --
  # no new secret to add.
  customer_web_deploy:
    name: Customer Web — Preview/Deploy
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      pull-requests: write # to comment the preview URL on the PR
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Same reasoning as publish_admin_test_build's identical step:
      # pubspec.yaml declares .env as a required asset; it's gitignored
      # and never in a fresh CI checkout. An empty placeholder is
      # enough to satisfy the asset bundler.
      - name: Create placeholder .env for asset bundling
        run: touch .env

      - name: Build customer web app
        run: flutter build web --release -t lib/main_customer.dart

      # Split into two explicit steps rather than one step with a
      # ternary channelId -- an empty-string channelId is not the
      # same as omitting the key, and this action's own docs treat
      # "no channelId" (PR event) vs "channelId: live" (push) as the
      # two distinct, supported modes.
      # FIX (Sep 3 2026): the two deploy steps below used to test
      # `secrets.FIREBASE_SERVICE_ACCOUNT != ''` INSIDE their `if:`.
      # The secrets context is not available in an if: expression, and
      # using it there makes GitHub reject the ENTIRE workflow file --
      # every run since then showed 0 jobs and the workflow's
      # registered name fell back to its file path
      # (".github/workflows/ci-cd.yml" instead of "CI/CD Pipeline"),
      # which is the same signature this file already hit once before
      # (see the notify-admin-build step's comment further down). Net
      # effect: no CI ran at all after PR #28 merged, so none of the
      # merged work was ever built.
      #
      # The presence check now happens in a step, where the secrets
      # context IS allowed, and the deploy steps gate on its output.
      - name: Check whether the Firebase secret is configured
        id: fb_secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "FIREBASE_SERVICE_ACCOUNT is not set — skipping the Firebase deploy steps."
          fi

      - name: Deploy preview channel (pull request)
        if: github.event_name == 'pull_request' && steps.fb_secret.outputs.present == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: erode-super-app
          target: customer

      - name: Deploy live (push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.fb_secret.outputs.present == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: erode-super-app
          target: customer
          channelId: live

  # ============================================================
  # Job 3b: Publish Admin Test Build — the missing link in the
  # "Chitti voice -> GitHub issue -> Claude -> merge -> testable APK"
  # pipeline (Sep 1 2026, Nizam: "namma automation work ah fullfill ah
  # mudi").
  #
  # The android matrix build above runs `flutter build apk` with NO
  # --flavor, which compiles lib/main.dart — not lib/main_admin.dart.
  # It has never once produced the admin app this whole automation
  # exists to test. This job builds the actual admin flavor and
  # publishes it somewhere Nizam can reach from his phone without
  # opening GitHub Actions logs:
  #   1. A rolling "latest-admin-test" GitHub Release (always the same
  #      tag, so ChittiDevMonitorScreen's releases/latest API call keeps
  #      working without the workflow needing to invent version tags).
  #   2. An FCM push to the `chitti_dev_builds` topic the admin app
  #      subscribes to (see main_admin.dart), so this isn't something
  #      that needs polling — it lands like every other admin alert.
  # Runs on every push to main, independent of the platform matrix
  # above and its own (separately broken — branch and tag refs cannot
  # both match) deploy-job condition.
  publish_admin_test_build:
    name: Publish Admin Test Build
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # NEW (Sep 4 2026): full history, because the changelog step
        # below diffs against the previous build's tag. With the default
        # depth-1 checkout there is nothing to diff against.
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # FIX (Sep 2 2026): pubspec.yaml declares .env as a required
      # asset, but .env is gitignored (it holds live API keys) and was
      # never in this checkout -- the very first real run of this job
      # (previous runs on PR branches all showed "skipping", per the
      # if: github.ref check above, so this had never actually executed
      # until now) failed at "Error detected in pubspec.yaml: No file
      # or variants found for asset: .env" during asset bundling.
      # Flutter only needs the file to exist to bundle it -- nothing in
      # lib/ calls dotenv.load() on this file, so an empty placeholder
      # is enough to satisfy the asset declaration without a real
      # secret ever touching a CI log.
      - name: Create placeholder .env for asset bundling
        run: touch .env

      # FIX (Sep 3 2026): this job's first-ever real run (after the
      # .env fix above got it past asset bundling) failed at
      # packageAdminRelease with "SigningConfig 'release' is missing
      # required property 'storeFile'" -- android/app/build.gradle.kts
      # reads real signing credentials from android/key.properties,
      # which is gitignored and never present on a fresh checkout.
      # This is an internal sideload-only test build (not a Play Store
      # upload -- Deploy to Stores is a separate, currently-skipped
      # job), so a throwaway self-signed debug keystore generated at
      # build time is enough to satisfy the release signingConfig --
      # no real signing secret needs to exist for this job to work.
      # CRITICAL FIX (Sep 4 2026 — Nizam: "app already phone la
      # irunthatha new version upload pannumbothu update kuduththa
      # conflict varuthu ... conflict kaatave kudathu").
      #
      # ROOT CAUSE, and it was this step. It used to run `keytool
      # -genkeypair` on EVERY run, so every build was signed with a
      # BRAND NEW key. Android refuses to install an update whose
      # signature differs from the installed app
      # (INSTALL_FAILED_UPDATE_INCOMPATIBLE, surfaced to the user as the
      # useless "App not installed"). So every single update conflicted,
      # and the only way through was uninstall — which wipes app data.
      # That is not a UX problem to soften, it is a broken update path.
      #
      # The fix is one stable key reused by every build. It comes from
      # the ANDROID_KEYSTORE_BASE64 secret so no key material is ever
      # committed. If that secret is missing the job now FAILS LOUDLY
      # rather than quietly falling back to a fresh throwaway key —
      # silently shipping an uninstallable APK is worse than not
      # shipping one, because the breakage only shows up on Nizam's
      # phone minutes later.
      - name: Restore the stable signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set."
            echo "Every build would be signed with a different key, and Android"
            echo "would reject the update on any phone that already has the app"
            echo "installed (INSTALL_FAILED_UPDATE_INCOMPATIBLE)."
            echo ""
            echo "Create the key ONCE on a laptop and add it as a secret:"
            echo '  keytool -genkeypair -v -keystore admin-release.jks \'
            echo '    -alias admin -keyalg RSA -keysize 2048 -validity 36500 \'
            echo '    -storepass <pw> -keypass <pw> -dname "CN=NJ Tech, O=NJ Tech, C=IN"'
            echo '  base64 -w0 admin-release.jks    # paste as ANDROID_KEYSTORE_BASE64'
            echo "Also add ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/admin-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=admin-release.jks
          EOF
          echo "Signing key restored. SHA-1 of the key this build will use:"
          keytool -list -v -keystore android/app/admin-release.jks \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null \
            | grep -E "SHA1:" || true

      # NEW (Sep 4 2026 — Nizam: "ovvoru pr merge pannunana app la athula
      # Yenna merge panni new update pannirukomnu admin app open
      # pannumbothe ... pop kaatanum ... apo than version ah correcta
      # understand panni pr merge la main la conrrecta agirukkanu
      # theriyum").
      #
      # Generated here and COMPILED INTO the apk as an asset, rather
      # than fetched from the GitHub API at runtime. The "what's new"
      # popup has to work on a phone with no signal and no GitHub token,
      # and a changelog that needs the network to explain an
      # offline-capable app is the wrong shape. It is also the honest
      # source: these are the actual commit subjects that landed since
      # the previously published build, not a hand-written list that can
      # drift from what really shipped.
      - name: Generate changelog for this build
        run: |
          mkdir -p assets/release_notes
          PREV="$(git rev-list -n 1 latest-admin-test 2>/dev/null || true)"
          {
            echo "build=${{ github.run_number }}"
            echo "sha=$(git rev-parse --short HEAD)"
            echo "date=$(date -u +%Y-%m-%d)"
            echo "---"
            if [ -n "$PREV" ] && git cat-file -e "$PREV" 2>/dev/null; then
              git log --no-merges --pretty=format:'%s' "$PREV..HEAD" | head -25
            else
              git log --no-merges --pretty=format:'%s' -10
            fi
          } > assets/release_notes/changelog.txt
          echo "--- changelog.txt ---"
          cat assets/release_notes/changelog.txt

      - name: Build admin flavor APK
        run: flutter build apk --release --flavor admin -t lib/main_admin.dart

      # NEW (Sep 4 2026 — Nizam: "ithukapram build pandra app la number
      # version mention pannu ... number paathave easily understand panni
      # correct app download panna easya irukum"). The old name was
      # allin1-admin-<sha>.apk, and a page of eight identical-looking hex
      # names with no order to them is genuinely unreadable — he could
      # not tell which build was today's. Leading with a zero-padded,
      # monotonically increasing build number makes the newest one
      # obvious at a glance AND sorts correctly in any file list.
      - name: Rename with version + build number
        id: apk
        run: |
          SRC="build/app/outputs/flutter-apk/app-admin-release.apk"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          APP_VERSION="$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | tr -d '[:space:]')"
          BUILD_NO="$(printf '%04d' '${{ github.run_number }}')"
          DATE="$(date -u +%Y%m%d)"
          DEST="build/app/outputs/flutter-apk/allin1-admin-b${BUILD_NO}-v${APP_VERSION}-${DATE}-${SHORT_SHA}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "build_no=$BUILD_NO" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "Built: $(basename "$DEST")"

      - name: Publish rolling GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-admin-test
          # Leads with the build number so the release title itself says
          # which asset is the current one — the release page lists
          # assets in no useful order, and matching title to filename was
          # the only way to tell.
          name: "Build ${{ steps.apk.outputs.build_no }} · v${{ steps.apk.outputs.app_version }} · ${{ steps.apk.outputs.short_sha }}"
          body_path: assets/release_notes/changelog.txt
          files: ${{ steps.apk.outputs.path }}
          prerelease: true
          # Overwrites the existing "latest-admin-test" release instead
          # of failing because the tag already exists — this tag is
          # meant to move.
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify admin app via FCM
        # FIX (Sep 2 2026): a job-level `if:` referencing the `secrets`
        # context directly caused GitHub to reject this entire workflow
        # file outright (every run showed 0 jobs and the workflow's
        # registered name fell back to its file path — the standard
        # signature of a file GitHub could not parse/validate at all).
        # The "is this secret set" check now lives inside the script
        # instead, which is also what notify-admin-build.js already
        # does on its own (see its early `if (!serviceAccountJson)`
        # exit) — this step always runs, and simply no-ops when the
        # secret hasn't been added yet.
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/latest-admin-test
          SHORT_SHA: ${{ steps.apk.outputs.short_sha }}
        run: |
          npm install firebase-admin@12 --no-save --silent
          node .github/scripts/notify-admin-build.js

  # ============================================================
  # Job 4: Security Scan - Dependency and vulnerability check
  # ============================================================
  security_scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run pub outdated
        run: flutter pub outdated

      - name: Run pub audit (if available)
        run: dart pub global activate dart_code_metrics && dart pub global run dart_code_metrics:metrics check-unnecessary --sdk-path=lib/
        continue-on-error: true

      - name: Check for known vulnerabilities
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pubspec = fs.readFileSync('pubspec.yaml', 'utf8');
            
            // Check for outdated or vulnerable packages
            const vulnerablePackages = [
              // Add known vulnerable packages here
            ];
            
            vulnerablePackages.forEach(pkg => {
              if (pubspec.includes(pkg)) {
                core.setFailed(`Vulnerable package detected: ${pkg}`);
              }
            });

  # ============================================================
  # Job 5: Deploy - Deploy to stores (requires approval)
  # ============================================================
  deploy:
    name: Deploy to Stores
    runs-on: ubuntu-latest
    needs: [test, analyze, build, security_scan]
    if: github.ref == 'refs/heads/main' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://play.google.com/store/apps/details?id=com.njtech.erode_superapp
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-android
          path: build/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Deploy to Google Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: com.njtech.erode_superapp
          releaseFiles: build/app/outputs/flutter-apk/app-release.apk
          track: internal
          status: completed
        if: github.event.inputs.deploy_to_production == 'true'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Notify deployment
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "🚀 Erode Super App ${{ github.ref_name }} deployed to production!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*🚀 Deployment Successful*\nVersion: ${{ github.ref_name }}\nCommit: ${{ github.sha }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: github.event.inputs.deploy_to_production == 'true'

  # ============================================================
  # Job 6: Notify - Send notifications
  # ============================================================
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [test, analyze, build]
    if: always()
    
    steps:
      - name: Check job status
        id: check
        run: |
          if [ "${{ needs.test.result }}" == "failure" ] || \
             [ "${{ needs.analyze.result }}" == "failure" ] || \
             [ "${{ needs.build.result }}" == "failure" ]; then
            echo "status=failed" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
          fi

      - name: Notify failure
        uses: actions/github-script@v7
        if: steps.check.outputs.status == 'failed'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ CI/CD pipeline failed. Please check the workflow logs.'
            })

